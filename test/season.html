<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>banc d'essai — resolveur de saison</title>
<style>
  html,body{margin:0;min-height:100%;background:#11121a;
    font:12px ui-monospace,Menlo,monospace;color:#cfd3e2}
  #log{padding:10px 14px;line-height:1.8}
  .ok{color:#8ee6a8} .bad{color:#ff8899} .k{color:#f2b8cd}
</style>
</head>
<body>
<div id="log"></div>
<script type="module">
/*
 * Contrat pur de resolveSeason. Chaque check émet une ligne PASS/FAIL
 * (+ console.error en échec) et la page se termine par une ligne unique
 * greppable :
 *   SEASON: N pass, M fail
 *
 * Pipeline : fake storage + query string → resolveSeason.
 */
const log = document.getElementById('log');
const say = (s, cls = '') => { log.innerHTML += `<div class="${cls}">${s}</div>`; };
window.onerror = (m, _s, _l, _c, e) => { say('✗ ' + (e?.stack || m), 'bad'); console.error(m); };
window.addEventListener('unhandledrejection', e => { say('✗ ' + (e.reason?.stack || e.reason), 'bad'); console.error(e.reason); });

import { resolveSeason } from '../src/season.js';

let pass = 0, fail = 0;
function check(name, cond, detail = '') {
  if (cond) { pass++; say(`PASS — ${name}${detail ? ` <span class="k">(${detail})</span>` : ''}`, 'ok'); }
  else { fail++; say(`FAIL — ${name}${detail ? ` (${detail})` : ''}`, 'bad'); console.error(`FAIL — ${name} ${detail}`); }
}

function fakeStorage(value) {
  return {
    getItem(key) {
      if (key !== 'sakurajima.season') return null;
      return value;
    },
  };
}

say('modules chargés', 'ok');

/* 1. défaut → spring */
check('défaut → spring',
  resolveSeason() === 'spring',
  `got ${resolveSeason()}`);

/* 2. stockage autumn → autumn */
check('stockage autumn → autumn',
  resolveSeason({ storage: fakeStorage('autumn') }) === 'autumn',
  `got ${resolveSeason({ storage: fakeStorage('autumn') })}`);

/* 3. query spring prioritaire sur stockage autumn */
check('query spring prioritaire sur stockage autumn',
  resolveSeason({ search: '?season=spring', storage: fakeStorage('autumn') }) === 'spring',
  `got ${resolveSeason({ search: '?season=spring', storage: fakeStorage('autumn') })}`);

/* 4. query autumn prioritaire sur stockage spring */
check('query autumn prioritaire sur stockage spring',
  resolveSeason({ search: '?season=autumn', storage: fakeStorage('spring') }) === 'autumn',
  `got ${resolveSeason({ search: '?season=autumn', storage: fakeStorage('spring') })}`);

/* 5. query invalide → stockage autumn */
check('query invalide tombe sur stockage autumn',
  resolveSeason({ search: '?season=winter', storage: fakeStorage('autumn') }) === 'autumn',
  `got ${resolveSeason({ search: '?season=winter', storage: fakeStorage('autumn') })}`);

/* 6. query invalide sans stockage valide → spring */
check('query invalide sans stockage valide → spring',
  resolveSeason({ search: '?season=nope', storage: fakeStorage(null) }) === 'spring',
  `got ${resolveSeason({ search: '?season=nope', storage: fakeStorage(null) })}`);

/* 7. stockage invalide → spring */
check('stockage invalide → spring',
  resolveSeason({ storage: fakeStorage('winter') }) === 'spring',
  `got ${resolveSeason({ storage: fakeStorage('winter') })}`);

/* 8. getItem qui lève → spring */
check('exception getItem → spring',
  resolveSeason({
    storage: {
      getItem() { throw new Error('storage blocked'); },
    },
  }) === 'spring',
  'exception swallowed');

const summary = `SEASON: ${pass} pass, ${fail} fail`;
say(`<br><b>${summary}</b>`, fail ? 'bad' : 'ok');
console.log(summary);
</script>
</body>
</html>
