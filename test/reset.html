<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>banc d'essai — bouton « effacer la progression »</title>
<style>
  html{font-size:16px}
  html,body{margin:0;min-height:100%;background:#14101a;color:#cfd3e2}
  body{font:12px ui-monospace,Menlo,monospace}
  #log{position:fixed;left:10px;top:10px;max-width:50vw;max-height:90vh;overflow:auto;
    padding:6px 10px;background:rgba(10,8,12,.8);line-height:1.6;z-index:5}
  .ok{color:#8ee6a8} .bad{color:#ff8899} .k{color:#f2b8cd}
</style>
</head>
<body>
<div id="log"></div>
<script type="module">
/*
 * Bouton « Effacer la progression » (やり直す, src/reset-ui.js) avec le VRAI
 * quest (src/quest.js, localStorage réel) et le VRAI carnet/toasts
 * (src/journal-ui.js) ; markup + CSS viennent d'index.html (source unique) et le
 * câblage reproduit celui de main.js (onConfirm = quest.reset() + toast). Pas de
 * WebGL requis. La partie « omamori remis / foulard / Espace ne fait pas
 * sauter » est dans test/reset-app.html (app réelle).
 *   INVARIANTS: N pass, M fail
 */
import { createQuest, STORAGE_KEY } from '/src/quest.js';
import { createJournalUI } from '/src/journal-ui.js';
import { createResetControl } from '/src/reset-ui.js';

const log = document.getElementById('log');
const say = (s, cls = '') => { log.innerHTML += `<div class="${cls}">${s}</div>`; };
let pass = 0, fail = 0, finished = false;
const finish = () => {
  if (finished) return;
  finished = true;
  const summary = `INVARIANTS: ${pass} pass, ${fail} fail`;
  say(`<br><b>${summary}</b>`, fail ? 'bad' : 'ok');
  console.log(summary);
};
window.onerror = (m, _s, _l, _c, e) => { fail++; say('✗ ' + (e?.stack || m), 'bad'); console.error(m); finish(); };
window.addEventListener('unhandledrejection', e => { fail++; say('✗ ' + (e.reason?.stack || e.reason), 'bad'); console.error(e.reason); finish(); });
function check(name, cond, detail = '') {
  if (cond) { pass++; say(`PASS — ${name}${detail ? ` <span class="k">(${detail})</span>` : ''}`, 'ok'); }
  else { fail++; say(`FAIL — ${name}${detail ? ` (${detail})` : ''}`, 'bad'); console.error(`FAIL — ${name} ${detail}`); }
}
const wait = (ms) => new Promise(r => setTimeout(r, ms));

/* ── markup + CSS de index.html ──────────────────────────────── */
const html = await (await fetch('/index.html', { cache: 'no-store' })).text();
const idx = new DOMParser().parseFromString(html, 'text/html');
for (const st of idx.querySelectorAll('head style')) document.head.appendChild(document.importNode(st, true));
for (const id of ['j-defs', 'toasts', 'journal']) document.body.appendChild(document.importNode(idx.getElementById(id), true));
// Le bouton vit dans le panneau d'index.html : on prend le panneau entier.
const panel = document.importNode(idx.getElementById('panel'), true);
panel.classList.remove('folded');
panel.classList.add('on');
panel.style.cssText = 'left:auto;right:1rem;bottom:1rem;opacity:1;transform:none;transition:none';
document.body.appendChild(panel);
const $ = (id) => document.getElementById(id);
const hidden = (el) => !el || el.hidden || getComputedStyle(el).display === 'none';
const btn = $('reset-btn'), ask = $('reset-confirm'), msg = $('reset-msg'), yes = $('reset-yes'), no = $('reset-no');

/* Réglages posés AVANT : le bouton ne doit jamais y toucher. */
localStorage.removeItem(STORAGE_KEY);
localStorage.setItem('sakurajima.quality', 'ultra');
localStorage.setItem('sakurajima.season', 'autumn');

/* ── quest réel, partiellement rempli ────────────────────────── */
const quest = createQuest({ sites: { jizo: { x: 0, z: 0 }, pine: { x: 50, z: 50 } }, treasureIds: ['t1', 't2', 't3'] });
let resets = 0, dialogs = 0, confirmed = 0;
quest.on('reset', () => { resets++; });
const nativeDialogs = ['confirm', 'alert', 'prompt'].map(k => [k, window[k]]);
for (const [k] of nativeDialogs) window[k] = () => { dialogs++; return true; };
const ctl = createResetControl({
  delay: 600,
  onConfirm: () => {
    confirmed++;
    quest.reset();
    ui.toast('sniff', { text: 'Carnet vierge — tout est à redécouvrir' });
  },
});

const sum = () => { const t = quest.totals(); return t.stamps.got + t.treasures.got + t.challenges.reduce((a, c) => a + c.count, 0); };
const seed = () => {
  quest.update(0, 0);                               // tampon jizō
  quest.report('treasure', { id: 't1' });
  quest.report('crab-flee');
};
seed();                                              // avant le carnet : aucun toast de sceau en file
const ui = createJournalUI({ quest });
quest.on('reset', () => ui.refresh());
const SEEDED = 3;
check('progression semée (tampon + omamori + défi)', sum() === SEEDED, `somme=${sum()}`);
check('clé de quête écrite', !!localStorage.getItem(STORAGE_KEY));

/* ── markup ──────────────────────────────────────────────────── */
check('bouton dans .panel-body, avant .hint', !!btn.closest('.panel-body') && !!(btn.closest('.row').compareDocumentPosition(panel.querySelector('.hint')) & 4));
check('vrais <button type=button> (bouton, oui, annuler)', [btn, yes, no].every(b => b.tagName === 'BUTTON' && b.type === 'button'));
check('libellé FR + japonais', /Effacer la progression/.test(btn.textContent) && /やり直す/.test(btn.textContent), btn.textContent.trim());
check('message de confirmation en aria-live', /polite|assertive/.test(msg.getAttribute('aria-live') || ''));
check('état initial : confirmation masquée (aussi visuellement), bouton visible', hidden(ask) && getComputedStyle(ask).display === 'none' && !hidden(btn));
check('état initial : message vide', msg.textContent === '');

/* ── 1er clic : demande, n'efface RIEN ───────────────────────── */
btn.click();
check('1er clic : message « Vraiment ? … foulard »', /^Vraiment/.test(msg.textContent) && /Tampons, omamori, défis et foulard/.test(msg.textContent), msg.textContent);
check('1er clic : « Oui, effacer » et « Annuler » visibles', !hidden(ask) && !hidden(yes) && !hidden(no) && /Oui, effacer/.test(yes.textContent) && /Annuler/.test(no.textContent));
check('1er clic : bouton initial masqué', hidden(btn));
check('1er clic : focus sur « Annuler » (défaut sûr)', document.activeElement === no);
check('1er clic : n\'efface rien', sum() === SEEDED && resets === 0 && !!localStorage.getItem(STORAGE_KEY));

/* ── Annuler ─────────────────────────────────────────────────── */
no.click();
check('« Annuler » : retour à l\'état initial', hidden(ask) && !hidden(btn) && msg.textContent === '');
check('« Annuler » : le focus revient au bouton', document.activeElement === btn);
check('« Annuler » : n\'efface rien', sum() === SEEDED && resets === 0 && confirmed === 0 && !!localStorage.getItem(STORAGE_KEY));

/* ── retour automatique ──────────────────────────────────────── */
btn.click();
await wait(300);
check('encore armé avant le délai', !hidden(ask) && ctl.isArmed());
await wait(500);
check('retour auto après le délai sans action', hidden(ask) && !hidden(btn) && !ctl.isArmed());
check('retour auto : n\'efface rien', sum() === SEEDED && resets === 0);

/* ── clic ailleurs ───────────────────────────────────────────── */
btn.click();
document.body.dispatchEvent(new PointerEvent('pointerdown', { bubbles: true }));
check('clic ailleurs : retour à l\'état initial', hidden(ask) && !hidden(btn));
check('clic ailleurs : n\'efface rien', sum() === SEEDED && resets === 0);
btn.click();
panel.querySelector('#panel-head').dispatchEvent(new PointerEvent('pointerdown', { bubbles: true }));
check('clic sur la tête du panneau : annule aussi', hidden(ask));
btn.click();
msg.dispatchEvent(new PointerEvent('pointerdown', { bubbles: true }));
check('pointeur dans la confirmation : reste armée', !hidden(ask));
no.click();

/* ── la durée par défaut est ~5 s (lue dans le module, pas attendue) ── */
const src = await (await fetch('/src/reset-ui.js', { cache: 'no-store' })).text();
check('délai par défaut ≈ 5 s', /DELAY_MS\s*=\s*5000/.test(src));

/* ── Oui ─────────────────────────────────────────────────────── */
btn.click();
yes.click();
const t = quest.totals();
check('« Oui » : quest.totals() à 0', t.stamps.got === 0 && t.treasures.got === 0 && t.challenges.every(c => c.count === 0 && c.tier === 0), `somme=${sum()}`);
check('« Oui » : un seul reset', resets === 1 && confirmed === 1, `resets=${resets} confirmed=${confirmed}`);
check('« Oui » : sakurajima.quest.v1 effacée', localStorage.getItem(STORAGE_KEY) === null, String(localStorage.getItem(STORAGE_KEY)));
check('sakurajima.quality INCHANGÉE', localStorage.getItem('sakurajima.quality') === 'ultra');
check('sakurajima.season INCHANGÉE', localStorage.getItem('sakurajima.season') === 'autumn');
check('« Oui » : retour à l\'état initial', hidden(ask) && !hidden(btn) && msg.textContent === '');
const toast = document.querySelector('#toasts .toast');
check('« Oui » : toast discret « Carnet vierge »', /Carnet vierge — tout est à redécouvrir/.test(toast?.textContent || '') && toast.classList.contains('quiet'), toast?.textContent.trim());
check('carnet redessiné à 0 tampon', /\b0\b/.test(document.getElementById('j-n-stamps').textContent), document.getElementById('j-n-stamps').textContent);
check('aucun confirm()/alert()/prompt()', dialogs === 0, `appels=${dialogs}`);

/* ── après Oui, rien ne reste armé ───────────────────────────── */
await wait(900);
check('timer purgé après « Oui »', hidden(ask) && !hidden(btn) && !ctl.isArmed() && resets === 1);

/* ── la progression repart de zéro, et le bouton resserre ────── */
seed();
check('nouvelle progression possible après reset', sum() === SEEDED, `somme=${sum()}`);

finish();
</script>
</body>
</html>
