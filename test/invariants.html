<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>banc d'essai — invariants (delta, pont, enveloppes)</title>
<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.185.1/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.185.1/examples/jsm/"
} }
</script>
<style>
  html,body{margin:0;min-height:100%;background:#11121a;
    font:12px ui-monospace,Menlo,monospace;color:#cfd3e2}
  #log{padding:10px 14px;line-height:1.8}
  .ok{color:#8ee6a8} .bad{color:#ff8899} .k{color:#f2b8cd}
</style>
</head>
<body>
<div id="log"></div>
<script type="module">
/*
 * Invariants numériques du delta, du pont et des enveloppes de caméra.
 * Chaque check émet une ligne PASS/FAIL (+ console.error en échec) et la page
 * se termine par une ligne unique greppable :  INVARIANTS: N pass, M fail
 *
 * Le pipeline est le VRAI pipeline (ponds -> river -> carve -> island -> build),
 * en tier low pour que le bake reste court.
 */
const log = document.getElementById('log');
const say = (s, cls = '') => { log.innerHTML += `<div class="${cls}">${s}</div>`; };
window.onerror = (m, _s, _l, _c, e) => { say('✗ ' + (e?.stack || m), 'bad'); console.error(m); };
window.addEventListener('unhandledrejection', e => { say('✗ ' + (e.reason?.stack || e.reason), 'bad'); console.error(e.reason); });

import * as THREE from 'three';
import { SEED, WORLD, CAMERA, QUALITY, RIVER } from '../src/config.js';
import { seedNoise } from '../src/noise.js';
import { createWind } from '../src/wind.js';
import { createPonds } from '../src/ponds.js';
import { createRiver, BRANCHES } from '../src/river.js';
import { createIsland } from '../src/island.js';
import { initPath } from '../src/details.js';
import { FIELD_HALF as CLOUD_FIELD_HALF } from '../src/clouds.js';

let pass = 0, fail = 0;
function check(name, cond, detail = '') {
  if (cond) { pass++; say(`PASS — ${name}${detail ? ` <span class="k">(${detail})</span>` : ''}`, 'ok'); }
  else { fail++; say(`FAIL — ${name}${detail ? ` (${detail})` : ''}`, 'bad'); console.error(`FAIL — ${name} ${detail}`); }
}

seedNoise(SEED);
say('modules chargés', 'ok');

const wind = createWind();
const ponds = createPonds({ seed: SEED, wind, quality: QUALITY.low, heightAt: null });
const river = createRiver({ wind });
const carve = (x, z, h) => river.carveRiver(x, z, ponds.carvePonds(x, z, h));
const t0 = performance.now();
const island = createIsland({ seed: SEED, quality: { label: 'low', rocks: 8 }, carve });
say(`island bâtie en <span class="k">${((performance.now() - t0) / 1000).toFixed(1)} s</span> (tier low)`);
river.build(island.heightAt);

/* ── 1. profil d'eau monotone par branche (politique tidale : l'embouchure
 *       peut finir sous seaLevel+0.05, jamais remonter) ─────────────────── */
{
  const EPS = 1e-3;
  let allMono = true, worst = 0, worstAt = '';
  for (let b = 0; b < BRANCHES.length; b++) {
    const br = BRANCHES[b];
    // Point de départ : l'argmax pour le tronc, la zone épinglée pour une
    // branche — en aval de quoi la descente est garantie par le clamp final.
    let start = 0;
    if (b === 0) {
      for (let i = 1; i <= br.N; i++) if (br.profile[i] > br.profile[start]) start = i;
    } else {
      // stations épinglées = celles qui collent au tronc ; le clamp démarre
      // après. Approximation sûre : premier indice où le profil cesse de
      // suivre exactement une valeur constante par morceaux du tronc — on
      // prend simplement le max local initial.
      for (let i = 1; i <= br.N; i++) if (br.profile[i] > br.profile[start]) start = i; else break;
    }
    for (let i = start + 1; i <= br.N; i++) {
      const rise = br.profile[i] - br.profile[i - 1];
      if (rise > EPS) { allMono = false; if (rise > worst) { worst = rise; worstAt = `branche ${b}, station ${i}`; } }
    }
  }
  check('profil monotone (jamais remonter en aval)', allMono,
    allMono ? `${BRANCHES.length} branches` : `remontée de ${worst.toFixed(3)} à ${worstAt}`);
}

/* ── 2. trois embouchures distinctes ─────────────────────────────────────── */
{
  const mouths = BRANCHES.map((br) => ({ x: br.sx[br.N], z: br.sz[br.N] }));
  let minD = Infinity;
  for (let a = 0; a < mouths.length; a++) {
    for (let b = a + 1; b < mouths.length; b++) {
      minD = Math.min(minD, Math.hypot(mouths[a].x - mouths[b].x, mouths[a].z - mouths[b].z));
    }
  }
  check('3 embouchures écartées (> 80 u deux à deux)', mouths.length === 3 && minD > 80,
    `${mouths.length} embouchures, min ${minD.toFixed(0)} u`);
}

/* ── 3. continuité autour de la jonction : pas de trou isInRiver dans le
 *       chenal, pas de saut de carve entre sondes adjacentes ────────────── */
{
  // Transects perpendiculaires au tronc, de part et d'autre de la jonction
  // authorée [40,80]·L (le split est à t≈0.80 du tronc).
  const L = 3.1752;
  const junction = { x: 40 * L, z: 80 * L };
  let gapFree = true, smooth = true, worstJump = 0, worstBands = 0;
  for (let s = -5; s <= 5; s++) {
    // ligne de sondes espacées de 1 u, transversale (axe ~NE-SO)
    const cx = junction.x + s * 4, cz = junction.z + s * 2;
    // Un transect près de la jonction traverse LÉGITIMEMENT jusqu'à trois
    // chenaux (tronc + distributaires) séparés par de la terre. Le défaut
    // recherché — le scintillement d'identité de branche du champ combiné —
    // fragmentait le chenal en BEAUCOUP de petites bandes. On compte donc
    // les bandes contiguës : plus de 3, c'est un trou artificiel.
    let bands = 0, prevIn = false;
    let prevH = null;
    for (let o = -30; o <= 30; o += 1) {
      const x = cx + o * 0.6, z = cz - o * 0.8;
      const inR = river.isInRiver(x, z);
      if (inR && !prevIn) bands++;
      prevIn = inR;
      const h = island.heightAt(x, z);
      if (prevH !== null) {
        const jump = Math.abs(h - prevH);
        if (jump > worstJump) worstJump = jump;
        if (jump > 1.5) smooth = false;
      }
      prevH = h;
    }
    if (bands > worstBands) worstBands = bands;
    if (bands > 3) gapFree = false;
  }
  check('jonction sans trou isInRiver (≤ 3 bandes/transect)', gapFree, `max ${worstBands} bandes`);
  check('carve continu à la jonction (sauts < 1.5 u)', smooth, `pire saut ${worstJump.toFixed(2)} u`);
}

/* ── 3bis. contention : l'eau passe sous la berge la plus basse ──────────── */
{
  const _t9 = new THREE.Vector3();
  let contained = true, worst = 0, where = '';
  for (let b = 0; b < BRANCHES.length; b++) {
    const br = BRANCHES[b];
    for (let i = 1; i < br.N; i++) {
      if (!br.fade || br.fade[i] < 0.5) continue;
      // Zone d'épinglage de jonction (b>0, t<0.30) : exemptée du clamp par
      // conception — l'eau y est celle du tronc et les sondes « berges »
      // tombent dans le chenal mouillé voisin, pas sur de vraies berges.
      if (b > 0 && i / br.N < 0.30) continue;
      br.curve.getTangentAt(i / br.N, _t9);
      const nx = -_t9.z, nz = _t9.x;
      const l = Math.hypot(nx, nz) || 1;
      // Même sémantique que le clamp : la CRÊTE de digue par côté (max du sol
      // le long du rayon de berge), pas le sol à un offset unique.
      let crestL = -Infinity, crestR = -Infinity;
      for (let k2 = 0; k2 < 5; k2++) {
        const d = 6.9 + 0.5 + (14.9 * 0.85 - 0.5) * (k2 / 4);
        const gl2 = island.heightAt(br.sx[i] + (nx / l) * d, br.sz[i] + (nz / l) * d);
        const gr2 = island.heightAt(br.sx[i] - (nx / l) * d, br.sz[i] - (nz / l) * d);
        if (gl2 > crestL) crestL = gl2;
        if (gr2 > crestR) crestR = gr2;
      }
      const lim = Math.max(Math.min(crestL, crestR) - 0.10, 0.03 + 0.001);
      const excess = br.profile[i] - lim - 0.02;
      if (excess > 0.15 && excess > worst) { worst = excess; where = `b${b} i${i}`; contained = false; }
    }
  }
  check('eau contenue sous la berge la plus basse (fade>0.5)', contained,
    contained ? '' : `dépassement ${worst.toFixed(2)} u à ${where}`);
}

/* ── 4. build() idempotent ───────────────────────────────────────────────── */
{
  const before = river.group.children.length;
  river.build(island.heightAt);
  const after = river.group.children.length;
  check('river.build() idempotent (mêmes enfants)', before === after, `${before} → ${after}`);
}

/* ── 5. le chemin aboutit à la culée réelle ──────────────────────────────── */
{
  const end = initPath(river.bridgeInfo);
  const ends = river.bridgeInfo?.ends ?? [];
  let d = Infinity;
  for (const e of ends) d = Math.min(d, Math.hypot(end.x - e.x, end.z - e.z));
  check('fin du chemin < 8 u de la culée réelle', d < 8, `${d.toFixed(1)} u`);
}

/* ── 6. far plane ≥ pire cas caméra + bord réel de l'océan ───────────────── */
{
  const ocean = island.group.getObjectByName('ocean');
  ocean.geometry.computeBoundingSphere();
  const rim = ocean.geometry.boundingSphere.radius;
  check('CAMERA.far couvre maxDistance + bord océan réel',
    CAMERA.far >= CAMERA.maxDistance + rim,
    `far ${CAMERA.far} vs ${Math.round(CAMERA.maxDistance + rim)}`);
}

/* ── 7. champ de nuages au-delà de l'orbite maximale ─────────────────────── */
check('FIELD_HALF nuages > CAMERA.maxDistance', CLOUD_FIELD_HALF > CAMERA.maxDistance,
  `${CLOUD_FIELD_HALF} vs ${Math.round(CAMERA.maxDistance)}`);

const summary = `INVARIANTS: ${pass} pass, ${fail} fail`;
say(`<br><b>${summary}</b>`, fail ? 'bad' : 'ok');
console.log(summary);
</script>
</body>
</html>
