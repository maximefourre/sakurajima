<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>banc d'essai — invariants (île sans rivière)</title>
<script type="importmap">
{ "imports": {
    "three": "/vendor/three/build/three.module.js",
    "three/addons/": "/vendor/three/examples/jsm/"
} }
</script>
<style>
  html,body{margin:0;min-height:100%;background:#11121a;
    font:12px ui-monospace,Menlo,monospace;color:#cfd3e2}
  #log{padding:10px 14px;line-height:1.8}
  .ok{color:#8ee6a8} .bad{color:#ff8899} .k{color:#f2b8cd}
</style>
</head>
<body>
<div id="log"></div>
<script type="module">
/*
 * Invariants numériques de l'île sans rivière (étangs, réseau de chemins,
 * enveloppes). Chaque check émet une ligne PASS/FAIL (+ console.error en
 * échec) et la page se termine par une ligne unique greppable :
 *   INVARIANTS: N pass, M fail
 *
 * Pipeline : seedNoise → createWind → createPonds → carve = étangs →
 * createIsland → initPath(). Tier low pour un bake court.
 */
const log = document.getElementById('log');
const say = (s, cls = '') => { log.innerHTML += `<div class="${cls}">${s}</div>`; };
let pass = 0, fail = 0;
let finished = false;
const finish = () => {
  if (finished) return;
  finished = true;
  const summary = `INVARIANTS: ${pass} pass, ${fail} fail`;
  say(`<br><b>${summary}</b>`, fail ? 'bad' : 'ok');
  console.log(summary);
};
window.onerror = (m, _s, _l, _c, e) => {
  fail++;
  say('✗ ' + (e?.stack || m), 'bad');
  console.error(m);
  finish();
};
window.addEventListener('unhandledrejection', e => {
  fail++;
  say('✗ ' + (e.reason?.stack || e.reason), 'bad');
  console.error(e.reason);
  finish();
});

import { SEED, WORLD, CAMERA, QUALITY, PATHS, LAND_SCALE, FIREFLIES, BUTTERFLIES, POI, CRABS, MOTHS, STONES, HERONS, DRAGONFLIES, SEA_TORII, BAMBOO } from '../src/config.js';
import { seedNoise } from '../src/noise.js';
import { createWind } from '../src/wind.js';
import { createPonds, RIPPLE_SLOTS, KOI_SLOTS, DOG_SLOTS } from '../src/ponds.js';
import { createIsland, springReefSite, SEA_STACK_RANDOM, rockMossAmount } from '../src/island.js';
import { createDetails, flowerSpots, initPath, isOnPath, pathLitterOk, computeLanternSpots, computeRibbonMeshes, computeJunctionPad, computeOverlookTerrace, measureRibbonTriangleExact, pathSurfaceLiftAt, RIBBON_COLS, PATH_HALF } from '../src/details.js';
import { FIELD_HALF as CLOUD_FIELD_HALF } from '../src/clouds.js';
import { shadowEnvelope } from '../src/sky.js';
import * as THREE from 'three';
import { createShiba, SHIBA } from '../src/shiba.js';
import { createPetals, isPetalSand, forEachCarpetLeaf, airbornePetalAt, nearestAirbornePetal } from '../src/petals.js';
import { trunkHits } from '../src/sakura.js';
import { SHIBA_BUILD } from '../src/shiba-geom.js';
import { loadShibaBody } from '../src/shiba-gltf.js';
import { computeFireflySpots, fireflyActivity, createFireflies } from '../src/fireflies.js';
import { computeButterflySpawns, butterflyActivity, createButterflies } from '../src/butterflies.js';
import { computeShorePineSite, placeRock, computeJizoSite, computeTsukubaiSite, computeIwakuraSite, computeSteppingStones, stoneYAt, computeSeaToriiSite, computeChashitsuSite, chashitsuKeepOut, makeKuromatsuGeometry } from '../src/poi.js';
import { chashitsuPosts } from '../src/chashitsu.js';
import { computeCrabSpawns } from '../src/crabs.js';
import { computeMothSpots } from '../src/moths.js';
import { computeHeronSpawns, makeHeronGeometry, makeHeronFlyGeometry } from '../src/herons.js';
import { computeDragonflySpots, dragonflyActivity } from '../src/dragonflies.js';
import { computeGullSpawns } from '../src/gulls.js';
import { computeBambooSpawns, inBambooGrove } from '../src/bamboo.js';
import { createCloudShadow } from '../src/cloud-shadow.js';
import { ambientWeights } from '../src/audio.js';

function check(name, cond, detail = '') {
  if (cond) { pass++; say(`PASS — ${name}${detail ? ` <span class="k">(${detail})</span>` : ''}`, 'ok'); }
  else { fail++; say(`FAIL — ${name}${detail ? ` (${detail})` : ''}`, 'bad'); console.error(`FAIL — ${name} ${detail}`); }
}

seedNoise(SEED);
say('modules chargés', 'ok');

/* Tier du bake, par ?q=low|high|ultra — low par DÉFAUT (bake court, flux
 * documenté dans AGENTS.md inchangé). heightAt interpole la grille BAKÉE, dont
 * le pas dépend du tier (~4.6 u en low, ~1.9 u en ultra) : low est le terrain
 * le plus lisse, donc le cas le PLUS FACILE pour les invariants de rubans.
 * Repasser le banc en ?q=ultra après toute retouche de la géométrie des chemins. */
const TIER = (() => {
  const q = new URLSearchParams(location.search).get('q');
  return q === 'ultra' || q === 'high' ? q : 'low';
})();
say(`TIER=${TIER}`, 'k');
console.log(`TIER=${TIER}`);
if (TIER !== 'ultra') {
  say(`WARN: banc en ${TIER} — les rubans se jugent en ?q=ultra`, 'bad');
  console.warn(`WARN: banc en ${TIER} — les rubans se jugent en ?q=ultra`);
}

const wind = createWind();
const ponds = createPonds({ seed: SEED, wind, quality: QUALITY[TIER], heightAt: null });
const carve = (x, z, h) => ponds.carvePonds(x, z, h);
const t0 = performance.now();
const island = createIsland({ seed: SEED, quality: { label: TIER, rocks: 8 }, carve });
say(`island bâtie en <span class="k">${((performance.now() - t0) / 1000).toFixed(1)} s</span> (tier ${TIER})`);

// Comme main.js:311 — sans ça PONDS porte des rayons NOMINAUX, et l'habitat des
// lucioles serait vérifié contre un bassin qui n'existe pas.
ponds.attach({ heightAt: island.heightAt });

/* ── 1. fin de la montée aux torii sur la terre ferme ────────────────────── */
{
  const end = initPath({
    heightAt: island.heightAt,
    heightGrid: island.heightGrid,
    slopeAt: island.slopeAt,
  });
  const h = island.heightAt(end.x, end.z);
  check('chemin sur la terre ferme', h > WORLD.seaLevel + 0.5,
    `end h=${h.toFixed(2)} (seuil ${WORLD.seaLevel + 0.5})`);
}

/* ── 2. far plane ≥ pire cas caméra + bord réel de l'océan ───────────────── */
{
  const ocean = island.group.getObjectByName('ocean');
  ocean.geometry.computeBoundingSphere();
  const rim = ocean.geometry.boundingSphere.radius;
  check('CAMERA.far couvre maxDistance + bord océan réel',
    CAMERA.far >= CAMERA.maxDistance + rim,
    `far ${CAMERA.far} vs ${Math.round(CAMERA.maxDistance + rim)}`);
  const dx = CAMERA.start.x - CAMERA.target.x;
  const dz = CAMERA.start.z - CAMERA.target.z;
  const dy = CAMERA.start.y - CAMERA.target.y;
  const down = Math.atan2(dy, Math.hypot(dx, dz));
  const halfFov = CAMERA.fov * Math.PI / 360;
  check('ouverture : haut du cadre au-dessus de l’horizon',
    down < halfFov - 0.07,
    `lookDown ${(down * 180 / Math.PI).toFixed(1)}° halfFov ${(halfFov * 180 / Math.PI).toFixed(1)}°`);
}

{
  const cld = createCloudShadow();
  const wind = { uniforms: { uWindDir: { value: { x: 0.8, y: 0.6 } } } };
  cld.update(10, { sunDirection: { y: 0.7 }, day: 1 }, wind);
  const noon = cld.uniforms.uCldAmt.value;
  cld.update(10, { sunDirection: { y: -0.2 }, day: 0 }, wind);
  const night = cld.uniforms.uCldAmt.value;
  check('ombres de nuages : jour oui, nuit non',
    noon > 0.4 && night < 0.02,
    `noon ${noon.toFixed(2)} night ${night.toFixed(2)}`);
}

/* ── 3. champ de nuages au-delà de l'orbite maximale ─────────────────────── */
check('FIELD_HALF nuages > CAMERA.maxDistance', CLOUD_FIELD_HALF > CAMERA.maxDistance,
  `${CLOUD_FIELD_HALF} vs ${Math.round(CAMERA.maxDistance)}`);

{
  const env = shadowEnvelope(island.radius * 1.30 + 10);
  check('near d’ombre positif, boîte ≥ 1.30·île',
    env.R >= island.radius * 1.30 && env.D - env.R - 80 > 0,
    `R=${env.R.toFixed(1)} D=${env.D} near=${(env.D - env.R - 80).toFixed(1)} île=${island.radius.toFixed(1)}`);
}

/* ── 4. étangs carvés : centre dans le bassin, fond plus bas que pourtour ─── */
{
  let ok = true, detail = '';
  for (const p of ponds.PONDS) {
    const inPond = ponds.isInPond(p.x, p.z);
    const hCenter = island.heightAt(p.x, p.z);
    const hRim = island.heightAt(p.x + p.radius * 2.5, p.z);
    if (!inPond || !(hCenter < hRim)) {
      ok = false;
      detail = `pond@(${p.x.toFixed(0)},${p.z.toFixed(0)}) in=${inPond} hC=${hCenter.toFixed(2)} hR=${hRim.toFixed(2)}`;
      break;
    }
  }
  check('étangs carvés (centre mouillé, fond < pourtour)', ok,
    ok ? `${ponds.PONDS.length} bassins` : detail);
}

/* ── 5. routes sur la terre ferme, hors étangs ───────────────────────────── */
{
  let ok = true, detail = '';
  for (const route of PATHS.routes) {
    for (let i = 0; i < route.points.length; i++) {
      const [px, pz] = route.points[i];
      const isPlageEnd = route.name === 'plage' && i === route.points.length - 1;
      const hMin = isPlageEnd ? WORLD.seaLevel - 0.5 : WORLD.seaLevel + 0.3;
      const h = island.heightAt(px, pz);
      const inPond = ponds.isInPond(px, pz);
      if (!(h > hMin) || inPond) {
        ok = false;
        detail = `${route.name}[${i}] h=${h.toFixed(2)} (seuil ${hMin}) inPond=${inPond}`;
        break;
      }
    }
    if (!ok) break;
  }
  check('routes sur la terre ferme, hors étangs', ok,
    ok ? `${PATHS.routes.length} routes` : detail);
}

/* ── 6. la route des torii grimpe à la falaise ───────────────────────────── */
{
  const torii = PATHS.routes.find((r) => r.name === 'torii');
  const [sx, sz] = torii.points[0];
  const [ex, ez] = torii.points[torii.points.length - 1];
  const target = [-88 * LAND_SCALE, 0];
  const dist = Math.hypot(ex - target[0], ez - target[1]);
  const rise = island.heightAt(ex, ez) - island.heightAt(sx, sz);
  check('la route des torii grimpe à la falaise',
    dist < 14 && rise > 5,
    `dist fin→[-88L,0]=${dist.toFixed(1)} rise=${rise.toFixed(2)}`);
}

/* ── 7. aucune lanterne orpheline ────────────────────────────────────────── */
{
  const spots = computeLanternSpots(island.heightAt, island.slopeAt, ponds.isInPond);
  // extra = offset latéral 1.3 + slack d'arc 0.3. isOnPath ajoute PATH_HALF.
  const lanternExtra = 1.3 + 0.3;
  const orphans = spots.filter((s) => !isOnPath(s.x, s.z, lanternExtra));
  check('aucune lanterne orpheline', orphans.length === 0,
    `${spots.length} lanternes, extra ${lanternExtra}${orphans.length ? `, ${orphans.length} orphelines` : ''}`);
  const onDirt = spots.filter((s) => isOnPath(s.x, s.z, 0));
  check('aucune lanterne sur la terre battue', onDirt.length === 0,
    `${spots.length} lanternes, ${onDirt.length} sur ruban`);
  const inDrink = spots.filter((s) => ponds.isInPond(s.x, s.z)
    || ponds.pondWaterYAt(s.x, s.z) != null);
  check('aucune lanterne dans l’eau', inDrink.length === 0,
    `${spots.length} lanternes, ${inDrink.length} mouillées`);
}

/* ── 8-10. terre battue : dégagée, collée, hauteur logique fidèle ───────── */
{
  // Le ruban interpole SES triangles, le terrain les SIENS. Le builder et ce
  // banc partagent la même évaluation exacte : chaque triangle de ruban est
  // clippé par les sous-triangles de la grille bakée, puis les extrema de la
  // différence de deux plans sont évalués aux sommets de l'arrangement.
  const meshes = computeRibbonMeshes(island.heightAt, island.heightGrid);
  meshes.push(computeJunctionPad(island.heightAt, island.heightGrid));
  let worst = Infinity, worstAt = '', worstAll = Infinity, worstAllAt = '';
  let highest = -Infinity, highestAt = '';
  let covered = 0, coveredAll = 0, pieces = 0;
  let liftError = -Infinity, liftErrorAt = '';
  for (const m of meshes) {
    const { pos, idx } = m;
    for (let t3 = 0; t3 < idx.length; t3 += 3) {
      const iA = idx[t3], iB = idx[t3 + 1], iC = idx[t3 + 2];
      let interior = true;
      if (m.cols === RIBBON_COLS) {
        // Bande intérieure ≈ largeur×0.7 : on exclut les cellules touchant
        // les colonnes de bord, effilochées/discardées par le shader.
        const cA = iA % RIBBON_COLS, cB = iB % RIBBON_COLS, cC = iC % RIBBON_COLS;
        interior = Math.min(cA, cB, cC) >= 1
          && Math.max(cA, cB, cC) <= RIBBON_COLS - 2;
      }
      const ax = pos[iA * 3], ay = pos[iA * 3 + 1], az = pos[iA * 3 + 2];
      const bx = pos[iB * 3], by = pos[iB * 3 + 1], bz = pos[iB * 3 + 2];
      const cx = pos[iC * 3], cy = pos[iC * 3 + 1], cz = pos[iC * 3 + 2];
      if (interior) {
        // Invariant 10 inchangé : un barycentre par triangle borne l'écart de
        // la hauteur logique (shiba/caméra) à la surface visible.
        const mx = (ax + bx + cx) / 3, mz = (az + bz + cz) / 3;
        const my = (ay + by + cy) / 3;
        const logicalLift = pathSurfaceLiftAt(island.heightAt, mx, mz);
        const actualLift = my - island.heightAt(mx, mz);
        const err = Math.abs(logicalLift - actualLift);
        if (err > liftError) {
          liftError = err;
          liftErrorAt = `${m.name}@(${mx.toFixed(1)},${mz.toFixed(1)})`;
        }
      }

      const measure = measureRibbonTriangleExact(
        island.heightAt, island.heightGrid, pos, iA, iB, iC);
      if (!measure) continue; // triangle sans aire en XZ (pointe de plage)
      coveredAll++;
      pieces += measure.pieces;
      if (measure.min < worstAll) {
        worstAll = measure.min;
        worstAllAt = `${m.name}@(${measure.minPoint.x.toFixed(1)},${measure.minPoint.z.toFixed(1)})`;
      }
      if (measure.max > highest) {
        highest = measure.max;
        highestAt = `${m.name}@(${measure.maxPoint.x.toFixed(1)},${measure.maxPoint.z.toFixed(1)})`;
      }
      if (interior) {
        covered++;
        if (measure.min < worst) {
          worst = measure.min;
          worstAt = `${m.name}@(${measure.minPoint.x.toFixed(1)},${measure.minPoint.z.toFixed(1)})`;
        }
      }
    }
  }
  const convergencePasses = Math.max(...meshes.map((m) => m.clearancePasses));
  // Trois claims DISTINCTS, trois checks : un échec doit dire lequel a cassé.
  check('surface des rubans au-dessus du terrain', worst > 0.005,
    `${covered} triangles intérieurs / ${coveredAll} tous, ${pieces} intersections, `
    + `marge exacte intérieure ${worst.toFixed(4)} (${worstAt}), `
    + `tous triangles ${worstAll.toFixed(4)} (${worstAllAt}), `
    + `convergence ${convergencePasses} passes`);
  check('surface des rubans collée au terrain', highest <= 0.55,
    `${coveredAll} triangles couverts, élévation exacte max ${highest.toFixed(4)} `
    + `(${highestAt}), plafond 0.550`);
  // Le prototype Chrome low+ultra borne le lift reel dans [0, 0.232] u sur ce
  // maillage 9 cols / 0.5 u / patin 10x72 ; le bombe logique reste dans
  // [0, 0.12]. Leur ecart absolu est donc <= 0.232 aux points mesures :
  // le plafond 0.25 conserve 0.018 u de marge d'echantillonnage.
  check('hauteur logique des chemins fidèle à la surface visible', liftError <= 0.25,
    `écart max ${liftError.toFixed(3)} (${liftErrorAt}), plafond 0.250`);
}

/* ── terrasse dédiée (pas l'agrégat 8–10) ─────────────────────────────── */
{
  const terrace = computeOverlookTerrace(island.heightAt, island.heightGrid, island.slopeAt);
  const { pos, idx, edge } = terrace;
  let worst = Infinity, highest = -Infinity, liftError = -Infinity, covered = 0;
  for (let t3 = 0; t3 < idx.length; t3 += 3) {
    const iA = idx[t3], iB = idx[t3 + 1], iC = idx[t3 + 2];
    const eA = edge[iA], eB = edge[iB], eC = edge[iC];
    if (Math.max(eA, eB, eC) > 0.66) continue;
    const ax = pos[iA * 3], ay = pos[iA * 3 + 1], az = pos[iA * 3 + 2];
    const bx = pos[iB * 3], by = pos[iB * 3 + 1], bz = pos[iB * 3 + 2];
    const cx = pos[iC * 3], cy = pos[iC * 3 + 1], cz = pos[iC * 3 + 2];
    const mx = (ax + bx + cx) / 3, mz = (az + bz + cz) / 3;
    const my = (ay + by + cy) / 3;
    const logical = pathSurfaceLiftAt(island.heightAt, mx, mz);
    const actual = my - island.heightAt(mx, mz);
    liftError = Math.max(liftError, Math.abs(logical - actual));
    const measure = measureRibbonTriangleExact(
      island.heightAt, island.heightGrid, pos, iA, iB, iC);
    if (!measure) continue;
    covered++;
    if (measure.min < worst) worst = measure.min;
    if (measure.max > highest) highest = measure.max;
  }
  check('terrasse : dégagée, collée, lift logique',
    covered > 0 && worst > 0.005 && highest <= 0.55 && liftError <= 0.25,
    `${covered} tris, marge ${worst.toFixed(4)}, haut ${highest.toFixed(4)}, Δlift ${liftError.toFixed(3)}`);
}

/* ── largeur de ruban : plancher 0.78 après remap ─────────────────────── */
{
  const meshes = computeRibbonMeshes(island.heightAt, island.heightGrid);
  const floor = 0.78 * PATHS.width * 0.5 - 1e-3;
  let ok = true, detail = '';
  for (const m of meshes) {
    if (m.cols !== RIBBON_COLS) continue;
    const rows = m.rows;
    const step = Math.max(1, Math.floor((rows - 1) / 40));
    for (let i = 0; i < rows; i += step) {
      const iL = i * RIBBON_COLS;
      const iR = i * RIBBON_COLS + RIBBON_COLS - 1;
      const wL = Math.hypot(m.pos[iL * 3] - m.pos[(iL + 4) * 3], m.pos[iL * 3 + 2] - m.pos[(iL + 4) * 3 + 2]);
      const wR = Math.hypot(m.pos[iR * 3] - m.pos[(iR - 4) * 3], m.pos[iR * 3 + 2] - m.pos[(iR - 4) * 3 + 2]);
      // 4 colonnes du centre (col 4) au bord : approx demi-largeur.
      if (wL < floor || wR < floor) {
        ok = false;
        detail = `${m.name} row ${i} wL=${wL.toFixed(2)} wR=${wR.toFixed(2)} floor=${floor.toFixed(2)}`;
        break;
      }
    }
    if (!ok) break;
  }
  check('largeur de ruban ≥ 0.78 nominale', ok, ok ? `${meshes.length} routes` : detail);
}

/* ── côte habitée (lot 1) : pures seulement, pas de createPOI/createCrabs ──
 * Avant le premier await (glTF) : ces checks n'ont besoin que de heightAt,
 * isOnPath et isInPond, déjà prêts ici. */
{
  const site = computeShorePineSite({
    heightAt: island.heightAt,
    isOnPath,
    isInPond: ponds.isInPond,
  });
  if (!site) {
    check('pin de côte : site sur le sable, hors chemin', false,
      'computeShorePineSite a rendu null');
    check('rocher d’assise : au pied du pin, face mer', false,
      'pas de pin, donc pas de rocher');
  } else {
    const route = PATHS.routes.find((r) => r.name === 'plage');
    const [tx, tz] = route.points[route.points.length - 1];
    const dist = Math.hypot(site.x - tx, site.z - tz);
    const h = island.heightAt(site.x, site.z);
    const onPath = isOnPath(site.x, site.z, POI.pathClear);
    const inPond = ponds.isInPond(site.x, site.z);
    const inSand = h > WORLD.seaLevel && h < POI.sandCeil;
    check('pin de côte : terre ferme, hors chemin, bande sable',
      !onPath && !inPond && inSand && dist <= POI.pineSearch,
      `h=${h.toFixed(2)} dist=${dist.toFixed(2)} (plafond ${POI.pineSearch.toFixed(1)}) `
      + `onPath=${onPath} inPond=${inPond}`);

    const rock = placeRock(site, island.heightAt, isOnPath, ponds.isInPond);
    if (!rock) {
      check('rocher d’assise : au pied du pin, face mer', false, 'placeRock a rendu null');
    } else {
      const rh = island.heightAt(rock.x, rock.z);
      const rOnPath = isOnPath(rock.x, rock.z, POI.pathClear);
      const rPond = ponds.isInPond(rock.x, rock.z);
      const rSand = rh > WORLD.seaLevel && rh < POI.sandCeil;
      const ix = Math.sin(site.yaw), iz = Math.cos(site.yaw);
      const seaward = (site.x - rock.x) * ix + (site.z - rock.z) * iz;
      check('rocher d’assise : au pied du pin, face mer',
        !rOnPath && !rPond && rSand && seaward > 0,
        `h=${rh.toFixed(2)} seaward=${seaward.toFixed(2)} onPath=${rOnPath} inPond=${rPond}`);
    }
  }

  const pineGeo = makeKuromatsuGeometry();
  pineGeo.computeBoundingBox();
  const bb = pineGeo.boundingBox;
  const spanX = bb.max.x - bb.min.x;
  const spanZ = bb.max.z - bb.min.z;
  const spanY = bb.max.y - bb.min.y;
  pineGeo.dispose();
  check('kuromatsu : houppier large, pas une pile de disques',
    spanX > 2.4 && spanZ > 2.0 && spanY > 4.5,
    `bbox ${spanX.toFixed(2)} × ${spanY.toFixed(2)} × ${spanZ.toFixed(2)}`);
}

{
  const want = QUALITY[TIER].crabs;
  const spawns = computeCrabSpawns({
    heightAt: island.heightAt,
    isInPond: ponds.isInPond,
    count: want,
    seed: SEED,
  });
  let ok = spawns.length === want;
  let detail = ok ? '' : `compte ${spawns.length} au lieu de ${want}`;
  for (const s of spawns) {
    const h = island.heightAt(s.x, s.z);
    const wet = ponds.isInPond(s.x, s.z);
    if (h < CRABS.strandLo || h > CRABS.strandHi || wet) {
      ok = false;
      detail = `crabe@(${s.x.toFixed(1)},${s.z.toFixed(1)}) h=${h.toFixed(2)} inPond=${wet}`;
      break;
    }
  }
  check('crabes : laisse sèche, hors étangs', ok,
    ok ? `${spawns.length}/${want} crabes, bande [${CRABS.strandLo}, ${CRABS.strandHi.toFixed(2)}]`
      : detail);
}

/* ── signes sacrés (lot 3) : pures seulement ────────────────────────────── */
{
  const site = computeJizoSite({
    heightAt: island.heightAt,
    isOnPath,
    isInPond: ponds.isInPond,
  });
  if (!site) {
    check('jizō : hors ruban au carrefour', false, 'computeJizoSite a rendu null');
  } else {
    const onPath = isOnPath(site.x, site.z, POI.jizoPathExtra);
    check('jizō : hors ruban au carrefour', !onPath,
      `onPath=${onPath} @(${site.x.toFixed(2)},${site.z.toFixed(2)})`);
  }
}

{
  const site = computeTsukubaiSite({
    heightAt: island.heightAt,
    isOnPath,
    isInPond: ponds.isInPond,
  });
  if (!site) {
    check('tsukubai : hors étang et hors chemin', false,
      'computeTsukubaiSite a rendu null');
  } else {
    const wet = ponds.isInPond(site.x, site.z);
    const onPath = isOnPath(site.x, site.z, POI.pathClear);
    check('tsukubai : hors étang et hors chemin', !wet && !onPath,
      `inPond=${wet} onPath=${onPath} @(${site.x.toFixed(2)},${site.z.toFixed(2)})`);
  }
}

{
  const site = computeIwakuraSite();
  const reef = springReefSite();
  const d = (site && reef)
    ? Math.hypot(site.x - reef.x, site.z - reef.z)
    : Infinity;
  check('iwakura : à moins de 2 u du plus gros bloc du récif',
    Number.isFinite(d) && d <= POI.iwakuraMax,
    `dist=${d.toFixed(3)} (plafond ${POI.iwakuraMax})`);
}

/* ── nuit des routes (lot 5) : pures, computeLanternSpots déjà importé ──
 * Pas de createDetails : le helper pur rend le même habitat (routes +
 * terrasse, hors hokora). Pas de N figé — le compte suit le nombre de
 * lanternes du bake. */
{
  const empty = computeMothSpots({ lanternSpots: [], count: 40, seed: SEED });
  check('mites : population nulle sans lanternes', empty.length === 0,
    `${empty.length} mites pour un habitat vide`);

  const lanterns = computeLanternSpots(island.heightAt, island.slopeAt, ponds.isInPond);
  const rate = QUALITY[TIER].moths ?? MOTHS.perLantern[TIER] ?? 0;
  const want = Math.round(lanterns.length * rate);
  const moths = computeMothSpots({ lanternSpots: lanterns, count: want, seed: SEED });
  let ok = true, detail = '', worst = 0;
  const limit = MOTHS.maxSpawnDist;
  for (const m of moths) {
    let best = Infinity;
    for (const L of lanterns) {
      const d = Math.hypot(m.x - L.x, m.z - L.z);
      if (d < best) best = d;
    }
    if (best > worst) worst = best;
    if (best > limit) {
      ok = false;
      detail = `mite@(${m.x.toFixed(1)},${m.z.toFixed(1)}) à ${best.toFixed(2)} u (plafond ${limit})`;
      break;
    }
  }
  check('mites : chaque spawn à moins de 2.6 u d’une lanterne', ok,
    ok ? `${moths.length} mites, ${lanterns.length} lanternes, pire ${worst.toFixed(2)} u`
      : detail);
}

/* ── étangs le jour (lot 2) : pures seulement ─────────────────────────── */
{
  const pond = ponds.PONDS[0];
  const slabs = computeSteppingStones({
    pond,
    pondWaterYAt: ponds.pondWaterYAt,
    heightAt: island.heightAt,
    isOnPath,
    seed: SEED,
  });
  const koiR = STONES.koiClear * pond.radius;
  let ok = slabs.length >= STONES.countMin && slabs.length <= STONES.countMax;
  let detail = ok ? '' : `compte ${slabs.length} hors [${STONES.countMin}, ${STONES.countMax}]`;
  let worstFaith = 0;
  for (let i = 0; i < slabs.length; i++) {
    const s = slabs[i];
    const wy = ponds.pondWaterYAt(s.x, s.z);
    const r = Math.hypot(s.x - pond.x, s.z - pond.z);
    const yAt = stoneYAt(s.x, s.z, slabs);
    const faith = Math.abs(yAt - s.y);
    const lift = wy == null ? Infinity : Math.abs(s.y - (wy + STONES.lift));
    const h = island.heightAt(s.x, s.z);
    worstFaith = Math.max(worstFaith, faith, Number.isFinite(lift) ? lift : 0);
    if (wy == null || r < koiR || faith > 0.08 || lift > 0.08 || !(h < wy)
        || isOnPath(s.x, s.z, s.r)) {
      ok = false;
      detail = `dalle@(${s.x.toFixed(1)},${s.z.toFixed(1)}) wy=${wy} r=${r.toFixed(2)} `
        + `koiR=${koiR.toFixed(2)} faith=${faith.toFixed(3)} lift=${lift.toFixed(3)}`
        + ` h=${h.toFixed(2)} onPath=${isOnPath(s.x, s.z, s.r)}`;
      break;
    }
    if (i > 0) {
      const p = slabs[i - 1];
      const gap = Math.hypot(s.x - p.x, s.z - p.z) - s.r - p.r;
      if (gap > STONES.maxGap + 1e-3) {
        ok = false;
        detail = `écart ${gap.toFixed(2)} > ${STONES.maxGap} entre ${i - 1} et ${i}`;
        break;
      }
    }
  }
  check('pas japonais : grand étang, hors koi, hors ruban, stoneYAt fidèle', ok,
    ok ? `${slabs.length} dalles, foi max ${worstFaith.toFixed(3)} u`
      : detail);
}

{
  const want = QUALITY[TIER].herons;
  const spawns = computeHeronSpawns({
    seed: SEED,
    heightAt: island.heightAt,
    ponds: ponds.PONDS,
    isInPond: ponds.isInPond,
    count: want,
    pondWaterYAt: ponds.pondWaterYAt,
  });
  let ok = spawns.length === want;
  let detail = ok ? '' : `compte ${spawns.length} au lieu de ${want}`;
  for (const s of spawns) {
    const wet = ponds.isInPond(s.x, s.z);
    const i = ponds.PONDS.reduce((b, p, k) => {
      const d = Math.hypot(s.x - p.x, s.z - p.z);
      return d < b.d ? { d, k } : b;
    }, { d: Infinity, k: -1 }).k;
    const p = ponds.PONDS[i];
    const r = Math.hypot(s.x - p.x, s.z - p.z);
    const wy = ponds.pondWaterYAt(s.x, s.z);
    const depth = (wy ?? p.waterY) - island.heightAt(s.x, s.z);
    if (!wet || r < HERONS.koiClear * p.radius
        || depth < HERONS.shallowMin || depth > HERONS.shallowMax) {
      ok = false;
      detail = `héron@(${s.x.toFixed(1)},${s.z.toFixed(1)}) inPond=${wet} `
        + `r=${r.toFixed(2)} depth=${depth.toFixed(2)}`;
      break;
    }
  }
  check('hérons : pattes dans les bas-fonds, hors koi', ok,
    ok ? `${spawns.length}/${want} hérons, profondeur [${HERONS.shallowMin}, ${HERONS.shallowMax}]`
      : detail);
}

{
  const stand = makeHeronGeometry();
  const fly = makeHeronFlyGeometry();
  stand.computeBoundingBox();
  fly.computeBoundingBox();
  const sb = stand.boundingBox, fb = fly.boundingBox;
  const standH = sb.max.y - sb.min.y;
  const flySpan = fb.max.x - fb.min.x;
  const standSpan = sb.max.x - sb.min.x;
  const spanAttr = fly.getAttribute('aSpan');
  const pos = fly.getAttribute('position');
  let maxSpan = 0, tipOut = false;
  if (spanAttr && pos) {
    for (let i = 0; i < spanAttr.count; i++) {
      const s = spanAttr.getX(i);
      maxSpan = Math.max(maxSpan, s);
      if (s > 0.85 && Math.abs(pos.getX(i)) > 0.85) tipOut = true;
    }
  }
  const ok = standH > 1.05 && flySpan > 1.6 && standSpan > 0.22
    && fb.max.x > 0.85 && fb.min.x < -0.85
    && maxSpan > 0.9 && tipOut;
  check('héron : ailes déployées en vol, silhouette debout', ok,
    `debout H=${standH.toFixed(2)} span=${standSpan.toFixed(2)}  `
    + `vol spanX=${flySpan.toFixed(2)} [${fb.min.x.toFixed(2)}, ${fb.max.x.toFixed(2)}] `
    + `aSpan=${maxSpan.toFixed(2)} tip=${tipOut}`);
  stand.dispose();
  fly.dispose();
}

{
  const want = QUALITY[TIER].dragonflies;
  const spots = computeDragonflySpots({
    ponds: ponds.PONDS,
    heightAt: island.heightAt,
    isInPond: ponds.isInPond,
    count: want,
    seed: SEED,
  });
  let ok = spots.length > 0;
  let detail = ok ? '' : 'aucune libellule';
  let worst = 0;
  for (const s of spots) {
    const p = ponds.PONDS[s.pond];
    if (!p) { ok = false; detail = `pond ${s.pond} hors bornes`; break; }
    const r = Math.hypot(s.x - p.x, s.z - p.z);
    const ratio = r / (p.radius * DRAGONFLIES.habitatK);
    worst = Math.max(worst, ratio);
    const clear = s.y - p.waterY;
    if (ratio > 1 + 1e-6
        || clear < DRAGONFLIES.minHeight - 1e-3
        || clear > DRAGONFLIES.maxHeight + 1e-3) {
      ok = false;
      detail = `libellule@(${s.x.toFixed(1)},${s.z.toFixed(1)}) ratio=${ratio.toFixed(2)} `
        + `garde=${clear.toFixed(2)}`;
      break;
    }
  }
  const noon = dragonflyActivity({ night: 0, day: 1 });
  const night = dragonflyActivity({ night: 1, day: 0 });
  if (!(noon > 0 && night === 0)) {
    ok = false;
    detail = `activité midi=${noon} nuit=${night}`;
  }
  check('libellules : habitat bassin, actives le jour', ok,
    ok ? `${spots.length} libellules, pire rayon ${(worst * 100).toFixed(0)} % de l’habitat`
      : detail);
}

/* ── silhouette mer (lot 4) : pures + sites exportés par l'île ── */
{
  const site = computeSeaToriiSite({ heightAt: island.heightAt });
  if (!site) {
    check('torii marin : piliers dans l’eau (h < 0)', false, 'computeSeaToriiSite a rendu null');
  } else {
    const h0 = site.posts[0].h, h1 = site.posts[1].h;
    check('torii marin : piliers dans l’eau (h < 0)',
      h0 < 0 && h1 < 0,
      `posts h=${h0.toFixed(2)}, ${h1.toFixed(2)} nukiY=${site.nukiY.toFixed(2)}`);
    const plage = PATHS.routes.find((r) => r.name === 'plage');
    const [bx, bz] = plage.points[plage.points.length - 1];
    const st = SEA_TORII.stack;
    const dGate = Math.hypot(site.x - bx, site.z - bz);
    const dStack = Math.hypot(st.x - bx, st.z - bz);
    check('torii marin : plus près de la plage que son îlot',
      dGate < dStack - 2,
      `gate ${dGate.toFixed(1)} stack ${dStack.toFixed(1)}`);
  }

  const stacks = island.seaStacks || [];
  const extras = stacks.filter((s) => s.extra);
  const randoms = stacks.filter((s) => !s.extra);
  const st = SEA_TORII.stack;
  const extraHit = extras.find((s) => Math.hypot(s.x - st.x, s.z - st.z) < 1e-3);
  check('torii marin : stacks tirés intacts, un extra authoré',
    randoms.length === SEA_STACK_RANDOM && extras.length === 1 && !!extraHit,
    `random=${randoms.length}/${SEA_STACK_RANDOM} extra=${extras.length} `
      + `at (${st.x.toFixed(1)},${st.z.toFixed(1)})`);

  const want = QUALITY[TIER].gulls;
  const gulls = computeGullSpawns({
    stacks, torii: site, count: want, seed: SEED,
  });
  let gOk = gulls.length === want && want > 0;
  let gDetail = gOk ? '' : `compte ${gulls.length} au lieu de ${want}`;
  for (const g of gulls) {
    const onStack = stacks.some((s) => {
      const rad = Math.max(s.sx || 4, s.sz || 4) * 1.25 + 1.0;
      return Math.hypot(g.x - s.x, g.z - s.z) <= rad;
    });
    let onNuki = false;
    if (site) {
      const dx = g.x - site.x, dz = g.z - site.z;
      const c = Math.cos(site.yaw), s = Math.sin(site.yaw);
      const lx = dx * c - dz * s;
      const lz = dx * s + dz * c;
      onNuki = Math.abs(lz) < 0.9
        && Math.abs(lx) < 2.8 * site.scale
        && Math.abs(g.y - site.nukiY) < 1.4;
    }
    const kindOk = g.kind === 'stack' || g.kind === 'nuki';
    if (!kindOk || !(onStack || onNuki)) {
      gOk = false;
      gDetail = `gull@(${g.x.toFixed(1)},${g.z.toFixed(1)}) kind=${g.kind} `
        + `stack=${onStack} nuki=${onNuki}`;
      break;
    }
  }
  check('goélands : spawn sur un stack ou le nuki', gOk,
    gOk ? `${gulls.length}/${want} kind=stack|nuki`
      : gDetail);
}

/* ── chashitsu (lot 7) : pures seulement, pas de forêt ─────────────────── */
{
  const site = computeChashitsuSite({
    heightAt: island.heightAt,
    isOnPath,
    isInPond: ponds.isInPond,
    slopeAt: island.slopeAt,
  });
  if (!site) {
    check('chashitsu : lisière prairie, hors chemin, hors eau, pente douce', false,
      'computeChashitsuSite a rendu null');
    check('chashitsu : emprise ~6 u refusée par isLand', false, 'pas de site');
  } else {
    const onPath = isOnPath(site.x, site.z, POI.chashitsuPathExtra);
    const wet = ponds.isInPond(site.x, site.z);
    const slope = island.slopeAt(site.x, site.z);
    const h = island.heightAt(site.x, site.z);
    const prairie = h >= POI.chashitsuHMin && h <= POI.chashitsuHMax;
    check('chashitsu : lisière prairie, hors chemin, hors eau, pente douce',
      !onPath && !wet && slope < POI.chashitsuSlopeMax && prairie,
      `h=${h.toFixed(2)} slope=${slope.toFixed(3)} `
      + `@(${site.x.toFixed(2)},${site.z.toFixed(2)}) onPath=${onPath} inPond=${wet}`);

    const mockIsLand = (x, z) => !ponds.isInPond(x, z)
      && !isOnPath(x, z, 4)
      && island.heightAt(x, z) > 2.6
      && !chashitsuKeepOut(site, x, z);
    let nFail = 0, n = 0;
    const rs = [0, 1.6, 3.2, 4.8];
    for (let ri = 0; ri < rs.length; ri++) {
      const r = rs[ri];
      const turns = r === 0 ? 1 : 6;
      for (let k = 0; k < turns; k++) {
        const a = (k / turns) * Math.PI * 2;
        n++;
        if (!mockIsLand(site.x + Math.cos(a) * r, site.z + Math.sin(a) * r)) nFail++;
      }
    }
    const posts = chashitsuPosts(site);
    let postsIn = posts.length > 0;
    for (let i = 0; i < posts.length; i++) {
      if (!chashitsuKeepOut(site, posts[i].x, posts[i].z)) postsIn = false;
    }
    check('chashitsu : emprise ~6 u refusée par isLand',
      nFail >= 6 && postsIn,
      `${nFail}/${n} points du disque refusés, ${posts.length} poteaux dans l’emprise`);
  }
}

/* ── Eau et chien ─────────────────────────────────────────────────────────
 * `ponds.attach()` est appelé bien plus haut, juste après l'île : le chantier
 * lucioles en a besoin pour son habitat. Conséquence à connaître, elle n'est
 * pas neutre — attach RÉÉCRIT `PONDS` avec les valeurs MESURÉES (rayon moyen,
 * waterY, profondeur), donc les invariants qui le précèdent, l'invariant 4 en
 * particulier, travaillent sur des rayons mesurés et non authorés. Vérifié des
 * deux côtés de la fusion : ils passent dans les deux ordres. Ne pas rajouter
 * un second attach ici, il serait sans effet utile.
 */

/* ── le rig glTF, chargé une fois pour les invariants 12 et 22 à 26 ───────
 * Le harnais gagne ici son PREMIER await, et c'est le seul montage correct :
 * le module est un module ES, donc le top-level await est disponible, alors
 * qu'un check fait dans un .then s'ajouterait APRÈS la ligne « INVARIANTS: »
 * sans être compté, et qu'un rejet ne serait vu que par le unhandledrejection
 * de la l.34 — qui n'incrémente PAS `fail`.
 *
 * L'URL est relative à test/. Un asset absent doit FAIRE ÉCHOUER les
 * invariants qui en dépendent, pas les sauter : sinon la page imprime
 * « 21 pass, 0 fail » en vert alors que rien du chantier n'a été testé.
 */
let gltfRig = null, gltfCause = '';
try {
  gltfRig = await loadShibaBody({ url: '../assets/shiba/shiba.glb' });
  if (!gltfRig) gltfCause = 'loadShibaBody a rendu null — voir le warn ci-dessus';
} catch (e) {
  gltfCause = String(e && e.message ? e.message : e);
}

/* ── 11. il nage, il n'est pas un sous-marin ─────────────────────────────── */
{
  const centre = SHIBA_BUILD.standHeight * SHIBA_BUILD.scale;
  check('flottaison : la ligne de dos sort de l’eau',
    centre > SHIBA.swimFloat + 0.03 && SHIBA.swimDepth >= SHIBA.swimFloat,
    `centreline ${centre.toFixed(3)} vs flottaison ${SHIBA.swimFloat} `
    + `(dos émergé ${(centre - SHIBA.swimFloat).toFixed(3)})`);
}

/* ── 12. le plan des pattes est bien à position.y, SUR LES DEUX CORPS ──────
 * Côté procédural, c'est le seul invariant qui empêche MÉCANIQUEMENT de
 * raccourcir un tibia sans corriger standHeight : les deux vivent dans
 * SHIBA_BUILD, et si on les désynchronise le chien s'enfonce ou flotte.
 *
 * Il passe désormais par `shiba.soles()` et non plus par un `traverse` qui
 * cherchait un mesh nommé 'paw' : le rig glTF n'a qu'un SkinnedMesh, ce nom
 * n'y existe pas, et le test aurait échoué avec lowest = Infinity — pour une
 * mauvaise raison. Chaque rig sait mesurer SES pieds ; le banc n'a pas à
 * savoir lequel il tient.
 *
 * Le seuil de 0.09 ne bouge pas côté glTF. Ne PAS le serrer sous prétexte que
 * la normalisation pose les semelles à y = 0 : ce qu'on mesure est la semelle
 * SKINNÉE, pas la géométrie de repos, et le chien est posé sur un terrain
 * interpolé.
 */
{
  const water = {
    surfaceAt: (x, z) => {
      const p = ponds.pondWaterYAt(x, z);
      if (p !== null) return p;
      return island.heightAt(x, z) < WORLD.seaLevel ? WORLD.seaLevel : null;
    },
    impact: () => {}, setSwimmer: () => {},
  };
  const garde = (corps) => {
    const shiba = createShiba({ seed: SEED, heightAt: island.heightAt, water, body: corps });
    shiba.update(0, 0.016, null);
    shiba.group.updateMatrixWorld(true);
    const bas = Math.min(...shiba.soles().map((p) => p.y));
    const gap = bas - shiba.position.y;
    shiba.dispose();
    return gap;
  };
  const gapProc = garde(null);
  // Un SECOND rig glTF, exprès : dispose() libère la géométrie du corps qu'on
  // lui passe, et les invariants 22 à 26 travaillent encore sur le premier.
  const corpsGltf = gltfRig ? await loadShibaBody({ url: '../assets/shiba/shiba.glb' }) : null;
  const gapGltf = corpsGltf ? garde(corpsGltf) : NaN;
  const fmt = (g) => (Number.isNaN(g) ? 'absent' : `${g >= 0 ? '+' : ''}${g.toFixed(3)}`);
  check('les pattes touchent le sol logique (procédural ET glTF)',
    Math.abs(gapProc) < 0.09 && corpsGltf !== null && Math.abs(gapGltf) < 0.09,
    `procédural ${fmt(gapProc)}, glTF ${fmt(gapGltf)} sous position.y, plafond 0.090`
    + (corpsGltf ? '' : ` — ${gltfCause}`));
}

/* ── 13. pondWaterYAt cohérent, et sans contamination d'isInPond ──────────
 * La dernière boucle est le garde-fou contre une fusion future de
 * pondWaterYAt et isInPond : isInPond porte +1.0 u de marge et l'invariant 5
 * dépend de son empreinte exacte.
 */
{
  let ok = true, detail = '';
  for (const p of ponds.PONDS) {
    const centre = ponds.pondWaterYAt(p.x, p.z);
    const large = ponds.pondWaterYAt(p.x + p.radius * 3, p.z);
    const lit = island.heightAt(p.x, p.z);
    if (centre !== p.waterY || large !== null || !(p.waterY > lit + 0.5)) {
      ok = false;
      detail = `pond@(${p.x.toFixed(0)},${p.z.toFixed(0)}) centre=${centre} waterY=${p.waterY?.toFixed(2)} `
        + `large=${large} lit=${lit.toFixed(2)}`;
      break;
    }
  }
  if (ok) {
    for (const route of PATHS.routes) {
      for (const [px, pz] of route.points) {
        if (ponds.pondWaterYAt(px, pz) !== null) {
          ok = false; detail = `route ${route.name} dans l'eau @(${px.toFixed(0)},${pz.toFixed(0)})`; break;
        }
      }
      if (!ok) break;
    }
  }
  check('pondWaterYAt : niveau exact, rien au large, aucune route mouillée', ok,
    ok ? `${ponds.PONDS.length} bassins, ${PATHS.routes.length} routes` : detail);
}

/* ── 14. chaque étang est nageable ET on en sort ──────────────────────────
 * Une bande de gué de largeur nulle donnerait un chien qui passe de la terre
 * ferme à la nage d'une frame à l'autre. On vérifie qu'il existe partout une
 * marche progressive entre la berge sèche et la perte de pied.
 */
{
  const depthAt = (x, z) => {
    const s = ponds.pondWaterYAt(x, z);
    return s === null ? 0 : Math.max(0, s - island.heightAt(x, z));
  };
  // Version 1 de cet invariant agrégeait par Math.max sur TOUS les bassins et
  // comptait une bande de gué Infinity quand un rayon n'atteignait jamais la
  // perte de pied : un étang entièrement peu profond passait donc au chaud
  // derrière un voisin creux. Défaut relevé par la revue adversariale
  // ADV-2026-08-01-81F0C02. Chaque bassin est désormais jugé SEUL, et un rayon
  // sans perte de pied ne vaut plus une réussite : il ne compte simplement pas.
  let ok = true, detail = '', pireGlobal = Infinity, plusFaible = Infinity;
  for (const b of ponds.PONDS) {
    plusFaible = Math.min(plusFaible, b.depth);
    if (!(b.depth > SHIBA.swimDepth + 0.5)) {
      ok = false;
      detail = `bassin@(${b.x.toFixed(0)},${b.z.toFixed(0)}) profond de ${b.depth.toFixed(2)} u seulement `
        + `(minimum ${(SHIBA.swimDepth + 0.5).toFixed(2)})`;
      break;
    }
    let pireAzimut = Infinity, azimutsNageables = 0;
    for (let a = 0; a < 8; a++) {
      const th = (a / 8) * Math.PI * 2;
      const cx = Math.cos(th), cz = Math.sin(th);
      let dedans = null, dehors = null;
      for (let f = 1.15; f >= 0.40; f -= 0.005) {
        const d = depthAt(b.x + cx * b.radius * f, b.z + cz * b.radius * f);
        if (dehors === null && d > 0.04) dehors = f;
        if (d > SHIBA.swimDepth) { dedans = f; break; }
      }
      // Un rayon qui ne perd jamais pied est guéable de bout en bout : rien à
      // mesurer, mais surtout rien à créditer.
      if (dedans === null) continue;
      azimutsNageables++;
      pireAzimut = Math.min(pireAzimut, (dehors - dedans) * b.radius);
    }
    if (azimutsNageables === 0 || pireAzimut < 0.5) {
      ok = false;
      detail = `bassin@(${b.x.toFixed(0)},${b.z.toFixed(0)}) ${azimutsNageables} azimut(s) nageable(s), `
        + `bande ${pireAzimut === Infinity ? 'n/a' : pireAzimut.toFixed(2) + ' u'}`;
      break;
    }
    pireGlobal = Math.min(pireGlobal, pireAzimut);
  }
  check('chaque étang est nageable ET franchissable', ok,
    detail || `${ponds.PONDS.length} bassins, le moins creux ${plusFaible.toFixed(2)} u, `
      + `bande de gué la plus étroite ${pireGlobal.toFixed(2)} u`);
}

/* ── laisse de mer : la houle n'ouvre pas le large ───────────────────── */
{
  const seaLevel = WORLD.seaLevel;
  const x = 0, z = island.radius * 1.35;
  const h = island.heightAt(x, z);
  const deep = h < seaLevel - SHIBA.swimReach - 0.5;
  const water = {
    surfaceAt: (_x, _z, t) => seaLevel + 1.15 * Math.sin(t),
    isPond: () => false,
  };
  const dog = createShiba({ seed: SEED, heightAt: island.heightAt, water, body: null });
  let crestOpens = false;
  let maxS = -Infinity;
  for (let t = 0; t <= Math.PI * 2; t += 0.1) {
    const s = seaLevel + 1.15 * Math.sin(t);
    if (s > maxS) maxS = s;
    if (dog.passableAt(x, z, t)) crestOpens = true;
  }
  const deepPond = createShiba({
    seed: SEED,
    heightAt: () => seaLevel - 5,
    water: { surfaceAt: () => 8, isPond: () => true },
    body: null,
  });
  const pondOpen = deepPond.passableAt(0, 0, 0);
  dog.dispose();
  deepPond.dispose();
  check('laisse de mer : houle n’ouvre pas le large, étang profond ouvert',
    deep && maxS > seaLevel + 0.5 && !crestOpens && pondOpen,
    `h=${h.toFixed(2)} maxS=${maxS.toFixed(2)} crestOpens=${crestOpens} pondOpen=${pondOpen}`);
}

/* ── tapis : pas de feuilles sur la plage (elles y flottaient) ─────────── */
{
  check('sable émergé : entre mer et prairie',
    isPetalSand(0.5) && isPetalSand(1.4) && !isPetalSand(0) && !isPetalSand(4),
    '0.5/1.4 oui, 0/4 non');
  const probe = createPetals({
    seed: SEED,
    quality: { petals: 4, fallenPetals: 800 },
    season: 'autumn',
    canopies: [
      { x: 40 * LAND_SCALE, y: 8, z: 70 * LAND_SCALE, radius: 14, dominant: 'red' },
      { x: 0, y: 8, z: 0, radius: 10, dominant: 'yellow' },
    ],
    wind,
    heightAt: island.heightAt,
  });
  let sandHits = 0;
  const n = probe.carpetCount | 0;
  forEachCarpetLeaf(probe.carpet, (x, _y, z) => {
    if (isPetalSand(island.heightAt(x, z))) sandHits++;
  });
  probe.dispose();
  check('tapis d’automne hors du sable',
    n > 0 && sandHits === 0,
    `${sandHits} sur sable / ${n} posées`);
}

{
  const pond = ponds.PONDS[0];
  const onPond = createPetals({
    seed: SEED,
    quality: { petals: 4, fallenPetals: 700 },
    season: 'autumn',
    canopies: [{
      x: pond.x, y: pond.waterY + 5, z: pond.z,
      radius: pond.radius * 2.4, dominant: 'red',
    }],
    wind,
    heightAt: island.heightAt,
    waterYAt: (x, z) => ponds.pondWaterYAt(x, z),
  });
  let surface = 0, sunk = 0;
  const pn = onPond.carpetCount | 0;
  forEachCarpetLeaf(onPond.carpet, (x, y, z) => {
    const wy = ponds.pondWaterYAt(x, z);
    if (wy === null) return;
    if (Math.abs(y - wy) <= 0.12) surface++;
    else sunk++;
  });
  onPond.dispose();
  check('tapis : feuilles à la surface de l’étang',
    surface >= 3 && sunk === 0,
    `surface=${surface} coulées=${sunk} / ${pn}`);
}

{
  const walls = (island.rockKeepOut || []).filter((r) => r.r >= 2 && r.block !== false);
  const steps = (island.rockKeepOut || []).filter((r) => r.r >= 0.85 && r.block === false);
  const rk = walls[0];
  const hit = rk && island.hitsRock(rk.x, rk.z, 0);
  const miss = rk && !island.hitsRock(rk.x + rk.r + 2.5, rk.z, 0);
  check('hitsRock : gros bloc oui, à côté non',
    !!rk && hit && miss,
    rk ? `r=${rk.r.toFixed(2)} n=${walls.length}` : 'aucun gros rocher');
  if (rk && typeof island.resolveRock === 'function') {
    const out = island.resolveRock(rk.x, rk.z, 0.35);
    const cleared = !island.hitsRock(out.x, out.z, 0.35);
    const away = Math.hypot(out.x - rk.x, out.z - rk.z);
    check('resolveRock : centre d’un mur éjecté',
      cleared && away >= rk.r,
      `d=${away.toFixed(2)} r=${rk.r.toFixed(2)}`);
    const fly = island.resolveRock(rk.x, rk.z, 0.35, rk.topY + 0.3);
    check('resolveRock : au-dessus du sommet, on traverse',
      Math.hypot(fly.x - rk.x, fly.z - rk.z) < 1e-6,
      `d=${Math.hypot(fly.x - rk.x, fly.z - rk.z).toFixed(4)}`);
  } else {
    check('resolveRock : centre d’un mur éjecté', false,
      rk ? 'resolveRock absent' : 'aucun gros rocher');
    check('resolveRock : au-dessus du sommet, on traverse', false,
      rk ? 'resolveRock absent' : 'aucun gros rocher');
  }
  const dog = createShiba({
    seed: SEED,
    heightAt: island.heightAt,
    water: { surfaceAt: () => null },
    blocked: (x, z) => island.hitsRock(x, z, 0.35),
    body: null,
  });
  const blocked = rk ? !dog.passableAt(rk.x, rk.z, 0) : false;
  check('chien refusé au centre d’un rocher',
    !!rk && blocked,
    rk ? `r=${rk.r.toFixed(2)}` : 'pas de rocher');
  if (rk) {
    dog.position.set(rk.x, island.heightAt(rk.x, rk.z), rk.z);
    dog.update(0, 1 / 60);
    const freed = !island.hitsRock(dog.position.x, dog.position.z, 0.35);
    check('chien éjecté d’un rocher occupé',
      freed,
      `d=${Math.hypot(dog.position.x - rk.x, dog.position.z - rk.z).toFixed(2)}`);
  } else {
    check('chien éjecté d’un rocher occupé', false, 'pas de rocher');
  }
  dog.dispose();

  const step = steps[0];
  const climbY = step && island.rockYAt(step.x, step.z);
  const climbOpen = step && !island.hitsRock(step.x, step.z, 0.35);
  check('rocher bas : surface marchable, pas un mur',
    !!step && climbY > island.heightAt(step.x, step.z) && climbOpen,
    step
      ? `r=${step.r.toFixed(2)} top=${climbY.toFixed(2)} n=${steps.length}`
      : 'aucun bloc franchissable');
}

/* ── 15. le budget d'ondes est partitionné ────────────────────────────────
 * Verrou contractuel : le chien ne peut JAMAIS évincer une onde de koi. Avec
 * un ring buffer partagé il le ferait — les koi crèvent la surface ~1.3 fois/s
 * pour une onde qui vit ~5 s, donc les ramener à 3 slots ferait disparaître
 * leurs anneaux en pleine vie.
 */
check('bancs d’ondes disjoints',
  KOI_SLOTS + DOG_SLOTS === RIPPLE_SLOTS && KOI_SLOTS >= 8 && DOG_SLOTS >= 1,
  `${KOI_SLOTS} koi + ${DOG_SLOTS} chien = ${RIPPLE_SLOTS}`);

/* ── 16. lucioles dans leur habitat ──────────────────────────────────────── */
/* Renuméroté de 11 à 16 à la fusion : les deux sessions avaient écrit un
 * « invariant 11 » en parallèle, l'une pour la nage, l'autre pour les
 * lucioles. Aucune n'avait tort — elles ne se voyaient pas. */
{
  const spots = computeFireflySpots({
    ponds: ponds.PONDS,
    heightAt: island.heightAt,
    isInPond: ponds.isInPond,
    count: QUALITY[TIER].fireflies,
    seed: SEED,
  });

  let ok = spots.length > 0;
  let detail = spots.length ? '' : 'aucune position produite';
  let worstRatio = 0, worstAt = '';

  for (const s of spots) {
    // 1. jamais plus loin que le rayon d'habitat du bassin qu'on lui attribue
    const p = ponds.PONDS[s.pond];
    if (!p) { ok = false; detail = `pond index ${s.pond} hors bornes`; break; }
    const r = Math.hypot(s.x - p.x, s.z - p.z);
    const ratio = r / (p.radius * FIREFLIES.habitatK);
    if (ratio > worstRatio) { worstRatio = ratio; worstAt = `(${s.x.toFixed(0)},${s.z.toFixed(0)})`; }
    if (ratio > 1) {
      ok = false;
      detail = `individu à ${r.toFixed(1)} u du bassin ${s.pond} (habitat ${(p.radius * FIREFLIES.habitatK).toFixed(1)})`;
      break;
    }
    // 2. le bassin attribué est bien le PLUS PROCHE — sinon la phase partagée
    //    fait clignoter un individu au rythme d'un étang qui n'est pas le sien
    let best = s.pond, bestD = r;
    for (let k = 0; k < ponds.PONDS.length; k++) {
      const q = ponds.PONDS[k];
      const d = Math.hypot(s.x - q.x, s.z - q.z);
      if (d < bestD) { bestD = d; best = k; }
    }
    if (best !== s.pond) {
      ok = false;
      detail = `individu à (${s.x.toFixed(0)},${s.z.toFixed(0)}) attribué au bassin ${s.pond}, plus proche du ${best}`;
      break;
    }
    // 3. au-dessus de la surface, jamais dedans.
    //
    // La surface de reference est celle de TOUTE L'ENVELOPPE DE DERIVE, pas
    // celle du point seme : depuis ADV-2026-08-01-FIREFLY le placement prend le
    // point le plus HAUT que l'individu survolera, sinon une berge en pente le
    // faisait passer sous terre en cours de derive. Mesurer ici au centre
    // faisait echouer l'invariant sur sa propre hypothese perimee.
    const R_ENV = FIREFLIES.driftRadius[1];
    let surf = island.heightAt(s.x, s.z);
    for (let a = 0; a < 8; a++) {
      const th = (a / 8) * Math.PI * 2;
      surf = Math.max(surf, island.heightAt(s.x + Math.cos(th) * R_ENV, s.z + Math.sin(th) * R_ENV));
    }
    if (ponds.isInPond(s.x, s.z)) surf = Math.max(surf, p.waterY);
    const clearance = s.y - surf;
    if (!(clearance >= FIREFLIES.minHeight - 1e-3 && clearance <= FIREFLIES.maxHeight + 1e-3)) {
      ok = false;
      detail = `garde au sol ${clearance.toFixed(2)} hors [${FIREFLIES.minHeight}, ${FIREFLIES.maxHeight}]`;
      break;
    }
  }

  check('lucioles dans l’habitat des bassins', ok,
    ok ? `${spots.length} lucioles, 3 bassins, pire rayon ${(worstRatio * 100).toFixed(0)} % de l’habitat ${worstAt}`
       : detail);
}

/* ── les lucioles dorment le jour ────────────────────────────────────────── */
{
  // On appelle la VRAIE courbe, importée. Recopier la formule ici la ferait
  // dériver en silence le jour où on la retouche, et le test continuerait de
  // passer sur une version qui n'est plus celle qui tourne.
  const noon      = fireflyActivity({ night: 0, twilight: 0, solar: 0.5 });
  const midnight  = fireflyActivity({ night: 1, twilight: 0, solar: 0.0 });
  const afterDusk = fireflyActivity({ night: 1, twilight: 0, solar: FIREFLIES.peakSolar });

  check('les lucioles dorment le jour',
    noon === 0 && midnight > 0 && afterDusk > midnight,
    `midi ${noon.toFixed(3)} · minuit ${midnight.toFixed(3)} · apres-coucher ${afterDusk.toFixed(3)}`);
}

/* ── papillons : au-dessus du sol, ancrés sur une vraie fleur ───────────── */
{
  // flowerSpots n'est rempli que par createDetails — le banc ne l'appelait pas.
  // Mêmes arguments que main.js, `wind` et `season` COMPRIS : les fleurs sont
  // bâties avec makeFoliageMaterial(wind), qui déréférence son argument. Sans
  // eux le banc plante au lieu de rendre un verdict.
  createDetails({
    seed: SEED, quality: QUALITY[TIER],
    heightAt: island.heightAt,
    heightGrid: island.heightGrid,
    slopeAt: island.slopeAt,
    normalAt: island.normalAt,
    inWater: ponds.isInPond,
    wind,
    season: 'spring',
  });

  const nf = flowerSpots.length / 3;
  const spawns = computeButterflySpawns({
    flowerSpots, heightAt: island.heightAt,
    count: QUALITY[TIER].butterflies, seed: SEED,
  });
  let ok = spawns.length > 0 && nf > 0;
  let detail = ok ? '' : `spawns=${spawns.length} fleurs=${nf}`;
  let worstClear = Infinity, worstAt = '', gros = 0;

  for (const s of spawns) {
    if (s.big) gros++;
    // 1. ancré sur une fleur qui existe, et posé À SA VERTICALE
    const fi = s.flowerIndex;
    if (!(Number.isInteger(fi) && fi >= 0 && fi < nf)) {
      ok = false; detail = `flowerIndex ${fi} hors bornes (${nf} fleurs)`; break;
    }
    const fx = flowerSpots[fi*3], fz = flowerSpots[fi*3+2];
    if (Math.hypot(s.x - fx, s.z - fz) > 1e-3) {
      ok = false; detail = `papillon décalé de son ancre : (${s.x.toFixed(1)},${s.z.toFixed(1)}) vs (${fx.toFixed(1)},${fz.toFixed(1)})`; break;
    }
    // 2. dans la bande de croisière de SON espèce, jamais sous le sol
    const band = s.big ? BUTTERFLIES.big.cruiseY : BUTTERFLIES.small.cruiseY;
    const clear = s.y - island.heightAt(s.x, s.z);
    if (clear < worstClear) { worstClear = clear; worstAt = `(${s.x.toFixed(0)},${s.z.toFixed(0)})`; }
    if (!(clear >= band[0] - 1e-3 && clear <= band[1] + 1e-3)) {
      ok = false; detail = `garde ${clear.toFixed(2)} hors bande [${band[0]}, ${band[1]}] ${worstAt}`; break;
    }
  }
  check('papillons au-dessus du sol et ancrés sur une fleur', ok,
    ok ? `${spawns.length} papillons (${gros} machaons), ${nf} fleurs, garde min ${worstClear.toFixed(2)} ${worstAt}` : detail);
}

/* ── papillons : ils dorment la nuit ────────────────────────────────────── */
{
  // La VRAIE courbe, importée — pas une copie qui dériverait en silence.
  const noon  = butterflyActivity({ day: 1, night: 0, twilight: 0 });
  const night = butterflyActivity({ day: 0, night: 1, twilight: 0 });
  const dusk  = butterflyActivity({ day: 0, night: 0, twilight: 1 });
  check('les papillons dorment la nuit',
    night === 0 && noon > 0 && dusk > 0 && dusk < noon,
    `midi ${noon.toFixed(3)} · nuit ${night.toFixed(3)} · crepuscule ${dusk.toFixed(3)}`);
}


/* ── 20. lucioles : le RUNTIME, pas seulement le semis ────────────────────
 * ADV-2026-08-01-FIREFLY : les deux invariants precedents acceptaient toute
 * population non vide et n'instanciaient jamais createFireflies. loneFraction a
 * 0 ou 1, des periodes redevenues globales ou des attributs degeneres seraient
 * tous restes verts. Celui-ci construit le vrai systeme et l'interroge.
 */
{
  const ff = createFireflies({
    seed: SEED, quality: QUALITY[TIER],
    heightAt: island.heightAt, ponds: ponds.PONDS, isInPond: ponds.isInPond,
  });
  const g = ff.mesh.geometry;
  const n = g.instanceCount;
  const attendu = QUALITY[TIER].fireflies;
  const fl = g.getAttribute('aFlash'), gw = g.getAttribute('aGlow');

  const ratages = [];
  if (n !== attendu) ratages.push(`compte ${n} au lieu de ${attendu}`);
  if (!fl || fl.itemSize !== 3) ratages.push('aFlash absent ou pas vec3 (periode par instance perdue)');
  if (!gw || gw.itemSize !== 2) ratages.push('aGlow absent (eclat par instance perdu)');

  let solitaires = 0, bMin = Infinity, bMax = -Infinity, dMin = Infinity, dMax = -Infinity;
  const periodes = new Set();
  if (fl && gw) {
    for (let i = 0; i < n; i++) {
      const per = fl.array[i * 3 + 2];
      periodes.add(+per.toFixed(3));
      if (Math.abs(per - FIREFLIES.flashPeriod) > 1e-6) solitaires++;
      const b = gw.array[i * 2], d = gw.array[i * 2 + 1];
      bMin = Math.min(bMin, b); bMax = Math.max(bMax, b);
      dMin = Math.min(dMin, d); dMax = Math.max(dMax, d);
    }
    const partSolo = solitaires / Math.max(n, 1);
    // Le modele est un CHOEUR plus une minorite. Ni l'un ni l'autre ne doit
    // disparaitre : 0 % rend l'ile metronomique, 100 % dissout la synchronie.
    if (!(partSolo > 0.10 && partSolo < 0.36)) ratages.push(`solitaires ${(partSolo*100).toFixed(0)} % hors [10, 36]`);
    if (periodes.size < 10) ratages.push(`seulement ${periodes.size} periodes distinctes`);
    if (!(bMax - bMin > 0.4)) ratages.push(`eclat trop uniforme (${bMin.toFixed(2)}..${bMax.toFixed(2)})`);
    if (!(dMax - dMin > 0.4)) ratages.push(`duree de flash trop uniforme (${dMin.toFixed(2)}..${dMax.toFixed(2)})`);
  }

  // Le gate, sur le VRAI update() et non sur la courbe seule.
  ff.update(1, { day: 1, night: 0, twilight: 0, solar: 0.5 });
  if (ff.mesh.visible) ratages.push('visibles a midi');
  ff.update(1, { day: 0, night: 1, twilight: 0, solar: 0.82 });
  if (!ff.mesh.visible) ratages.push('invisibles en pleine nuit');

  // Les trois bassins doivent etre peuples.
  const spots = computeFireflySpots({ ponds: ponds.PONDS, heightAt: island.heightAt,
    isInPond: ponds.isInPond, count: attendu, seed: SEED });
  const parBassin = [0, 0, 0];
  for (const s of spots) parBassin[s.pond]++;
  if (parBassin.some((v) => v === 0)) ratages.push(`bassin vide : ${parBassin.join('/')}`);

  ff.dispose();
  check('lucioles : runtime, choeur et solitaires', ratages.length === 0,
    ratages.length ? ratages.join(' ; ')
      : `${n} instances, ${parBassin.join('/')} par bassin, ${(solitaires/n*100).toFixed(0)} % solitaires, `
        + `${periodes.size} periodes, eclat ${bMin.toFixed(2)}-${bMax.toFixed(2)}`);
}

/* ── 21. papillons : le RUNTIME, cap, butinage et sol ─────────────────────
 * ADV-2026-08-01-BFLY : les deux invariants precedents n'appelaient que des
 * fonctions pures. Le vol de cote, le butinage a 1.22 % de reussite et le taux
 * d'embardee 60x trop grand sont TOUS passes avec 19 pass, 0 fail. Celui-ci
 * fait tourner la machine a etats et regarde ce qu'elle produit.
 */
{
  const bf = createButterflies({
    seed: SEED, quality: QUALITY[TIER], season: 'spring',
    heightAt: island.heightAt, flowerSpots,
  });
  const m = bf.mesh;
  const jour = { day: 1, night: 0, twilight: 0 };
  const ratages = [];
  const _M = new THREE.Matrix4(), _p = new THREE.Vector3(), _q = new THREE.Quaternion(), _s = new THREE.Vector3();
  const avant = [], apres = [];

  const pose = (out) => {
    out.length = 0;
    for (let i = 0; i < m.count; i++) { m.getMatrixAt(i, _M); out.push(new THREE.Vector3().setFromMatrixPosition(_M)); }
  };

  const dt = 1 / 60;
  let t = 0;
  for (let k = 0; k < 60; k++) { t += dt; bf.update(t, dt, jour); }   // 1 s d'amorce
  pose(avant);
  bf.update(t + dt, dt, jour); t += dt;
  pose(apres);

  // 1. CAP CONTRE DEPLACEMENT. C'est le test qui aurait attrape le vol de cote :
  //    l'axe avant local (+Z) doit pointer la ou l'individu se deplace.
  let alignes = 0, mobiles = 0, pireDot = 1;
  for (let i = 0; i < m.count; i++) {
    const d = new THREE.Vector3().subVectors(apres[i], avant[i]); d.y = 0;
    if (d.length() < 1e-4) continue;                 // pose ou immobile : rien a dire
    mobiles++;
    d.normalize();
    m.getMatrixAt(i, _M); _M.decompose(_p, _q, _s);
    const fwd = new THREE.Vector3(0, 0, 1).applyQuaternion(_q); fwd.y = 0; fwd.normalize();
    const dot = fwd.dot(d);
    pireDot = Math.min(pireDot, dot);
    if (dot > 0.85) alignes++;
  }
  if (mobiles === 0) ratages.push('aucun papillon ne bouge');
  else if (alignes / mobiles < 0.9) ratages.push(`cap desaligne : ${alignes}/${mobiles} alignes, pire produit scalaire ${pireDot.toFixed(3)}`);

  // 2. BUTINAGE REEL. Sur trente secondes, au moins un individu doit atteindre
  //    une corolle. Avec la recherche globale d'origine (1.22 % de reussite)
  //    ce test echouait.
  const nf = flowerSpots.length / 3;
  let poses = 0;
  for (let k = 0; k < 1800; k++) { t += dt; bf.update(t, dt, jour); }
  pose(apres);
  for (let i = 0; i < m.count; i++) {
    for (let j = 0; j < nf; j += 1) {
      const dx = apres[i].x - flowerSpots[j*3], dz = apres[i].z - flowerSpots[j*3+2];
      if (dx*dx + dz*dz < 0.05*0.05 && Math.abs(apres[i].y - flowerSpots[j*3+1]) < 0.35) { poses++; break; }
    }
  }
  if (poses === 0) ratages.push('aucun papillon pose sur une corolle apres 30 s');

  // 3. JAMAIS SOUS LE SOL, meme apres une longue simulation.
  let pireGarde = Infinity, pireAt = '';
  for (let i = 0; i < m.count; i++) {
    const g = apres[i].y - island.heightAt(apres[i].x, apres[i].z);
    if (g < pireGarde) { pireGarde = g; pireAt = `(${apres[i].x.toFixed(0)},${apres[i].z.toFixed(0)})`; }
  }
  if (!(pireGarde > -0.05)) ratages.push(`papillon sous le sol : ${pireGarde.toFixed(2)} ${pireAt}`);

  // 4. SESSION LONGUE AVEC FUITES REPETEES — ADV-2026-08-01-BFLY.
  //    Le rappel vers l'ancre n'etait qu'angulaire et FLEE l'ignorait : rien ne
  //    bornait la position, donc sur la duree la population derivait vers le
  //    large, ou l'altitude serait calculee depuis le FOND MARIN. On harcele
  //    donc la population avec un repulseur mobile et on regarde ou elle finit.
  {
    const rep = new THREE.Vector3();
    for (let k = 0; k < 3600; k++) {                    // 60 s
      // Le repulseur balaie le champ de fleurs, forcant des fuites en chaine.
      const u = (k / 3600) * Math.PI * 2;
      const fi = (k * 977) % nf;
      rep.set(flowerSpots[fi*3] + Math.cos(u), 0, flowerSpots[fi*3+2] + Math.sin(u));
      bf.setRepeller(rep);
      t += dt; bf.update(t, dt, jour);
    }
    pose(apres);
    let enMer = 0, pireH = Infinity, loin = 0;
    // Bornes du champ de fleurs, elargies du domaine dur : aucun individu ne
    // doit se trouver au-dela.
    let fxMin = Infinity, fxMax = -Infinity, fzMin = Infinity, fzMax = -Infinity;
    for (let j = 0; j < nf; j++) {
      fxMin = Math.min(fxMin, flowerSpots[j*3]); fxMax = Math.max(fxMax, flowerSpots[j*3]);
      fzMin = Math.min(fzMin, flowerSpots[j*3+2]); fzMax = Math.max(fzMax, flowerSpots[j*3+2]);
    }
    const marge = BUTTERFLIES.homeRadius * 1.6 + 5;
    for (let i = 0; i < m.count; i++) {
      const h = island.heightAt(apres[i].x, apres[i].z);
      if (h < pireH) pireH = h;
      if (h <= WORLD.seaLevel + 0.5) enMer++;
      if (apres[i].x < fxMin - marge || apres[i].x > fxMax + marge
       || apres[i].z < fzMin - marge || apres[i].z > fzMax + marge) loin++;
    }
    if (enMer > 0) ratages.push(`${enMer} papillons au-dessus de la mer apres 60 s (terrain min ${pireH.toFixed(2)})`);
    if (loin > 0) ratages.push(`${loin} papillons hors du domaine elargi apres 60 s`);
    bf.setRepeller(new THREE.Vector3(0, -1e6, 0));
  }

  // 5. Le gate, sur le VRAI update().
  bf.update(t, dt, { day: 0, night: 1, twilight: 0 });
  if (m.visible) ratages.push('visibles en pleine nuit');
  bf.update(t, dt, jour);
  if (!m.visible) ratages.push('invisibles a midi');

  bf.dispose();
  check('papillons : runtime, cap, butinage et sol', ratages.length === 0,
    ratages.length ? ratages.join(' ; ')
      : `${m.count} papillons, ${alignes}/${mobiles} caps alignes (pire ${pireDot.toFixed(3)}), `
        + `${poses} poses sur corolle, garde min ${pireGarde.toFixed(2)}, 60 s de fuites sans sortie en mer`);
}

/* ── 22 à 26. le rig glTF du shiba ────────────────────────────────────────
 * Le harnais gagne ici son PREMIER await, et c'est le seul montage correct :
 * le module est un module ES, donc le top-level await est disponible, alors
 * qu'un check fait dans un .then s'ajouterait APRÈS la ligne « INVARIANTS: »
 * sans être compté, et qu'un rejet ne serait vu que par le unhandledrejection
 * de la l.34 — qui n'incrémente PAS `fail`.
 *
 * L'URL est relative à test/. Un asset absent doit FAIRE ÉCHOUER les cinq
 * invariants, pas les sauter : sinon la page imprime « 21 pass, 0 fail » en
 * vert alors que rien du chantier n'a été testé.
 *
 * UNITÉS. Le rig est chargé seul, donc `root.scale` vaut 1 et tout ce qu'on
 * mesure ici est en unités de CONSTRUCTION. En jeu, shiba.js pose
 * root.scale = SHIBA_BUILD.scale : les seuils qui se comparent à une constante
 * de monde (la flottaison) multiplient explicitement par ce facteur.
 */

/** L'os dominant d'un vertex : celui de ses 4 influences au plus gros poids. */
function osDominant(r, v) {
  const si = r.mesh.geometry.attributes.skinIndex;
  const sw = r.mesh.geometry.attributes.skinWeight;
  let best = -1, bi = 0;
  for (const c of ['X', 'Y', 'Z', 'W']) {
    const w = sw['get' + c](v);
    if (w > best) { best = w; bi = si['get' + c](v); }
  }
  return r.skeleton.bones[bi].name;
}
function compterDominance(r) {
  const m = new Map(r.skeleton.bones.map((b) => [b.name, 0]));
  const n = r.mesh.geometry.attributes.position.count;
  for (let v = 0; v < n; v++) m.set(osDominant(r, v), m.get(osDominant(r, v)) + 1);
  return m;
}
/** Hauteur du dos VISIBLE, en unités de construction : le plus haut vertex du
 *  tronc, DERRIÈRE le crâne et DEVANT la queue, près de l'axe.
 *  La fenêtre est bornée PAR MESURE, pas par transposition : le profil médian
 *  monte de 0.676 à z = -0.20 jusqu'à 0.905 à z = -0.10, donc le crâne commence
 *  vers z = -0.15 et toute fenêtre qui va au-delà mesure la base du crâne (elle
 *  annonçait 0.711 au lieu de 0.689). La spec, elle, donne 0.650 : elle a été
 *  mesurée en tranches PLEINE LARGEUR, or le point haut du tronc est sur l'axe
 *  médian — c'est la ligne de dos, justement.
 *
 *  Deux pièges évités ici, tous deux payés pendant le chantier G :
 *  — ne PAS prendre SHIBA_BUILD.standHeight, qui est la somme de la chaîne de
 *    patte, donc la ligne MÉDIANE et non le dos. L'invariant 11 fait cette
 *    confusion, comme le commentaire de shiba.js:81-82 ; sur le chien
 *    procédural elle est sans conséquence, sur le chibi elle vaut 0.29 u — la
 *    différence entre un chien qui nage et un chien qui coule.
 *  — ne PAS prendre « le plus haut vertex dominé par l'os body » : la porte de
 *    la tête est nulle en z < 0, donc l'ARRIÈRE DU CRÂNE retombe sur body et
 *    la mesure annonçait 1.006 au lieu de 0.650. */
function hauteurDosGltf(r) {
  const pos = r.mesh.geometry.attributes.position;
  let h = -Infinity;
  for (let v = 0; v < pos.count; v++) {
    const z = pos.getZ(v);
    if (z > -0.90 && z < -0.15 && Math.abs(pos.getX(v)) < 0.10) {
      h = Math.max(h, pos.getY(v));
    }
  }
  return h;
}

/** Centroïde des appuis en contact, sur la géométrie SKINNÉE au repos, en
 *  unités de construction. C'est la définition EXACTE qu'emploie la
 *  normalisation de shiba-gltf.js — et c'est le point : une version antérieure
 *  de cet invariant passait par `sole()`, qui rend le point le plus BAS d'une
 *  patte et non le centroïde de sa semelle, et trouvait un décentrage de 0.026
 *  là où il n'y en a pas. Mesurer par une autre définition, c'est mesurer autre
 *  chose. */
function milieuAppuisGltf(r) {
  const pos = r.mesh.geometry.attributes.position;
  const tmp = new THREE.Vector3();
  const skin = [];
  let yMin = Infinity;
  for (let v = 0; v < pos.count; v++) {
    r.mesh.getVertexPosition(v, tmp);
    skin.push(tmp.clone());
    yMin = Math.min(yMin, tmp.y);
  }
  // Le seuil de contact suit l'échelle appliquée à la géométrie.
  const seuil = 0.02 * 0.823;
  const split = -0.40 * 0.823 + 0.300;
  let zAv = 0, nAv = 0, zAr = 0, nAr = 0;
  for (const p of skin) {
    if (p.y - yMin >= seuil) continue;
    if (p.z > split) { zAv += p.z; nAv++; } else { zAr += p.z; nAr++; }
  }
  if (!nAv || !nAr) return NaN;
  return { milieu: (zAv / nAv + zAr / nAr) / 2, semelle: yMin, nAv, nAr };
}

/* ── 22. le rig glTF expose le contrat complet ── */
{
  const r = gltfRig;
  const manque = !r ? ['rig absent'] : [
    ...['root', 'tilt', 'body', 'neck', 'head', 'jaw', 'tailBase', 'material', 'mesh', 'skeleton']
      .filter((k) => !r[k]),
    ...(r.lids && r.lids.length === 2 ? [] : ['lids[2]']),
    ...(r.ears && r.ears.length === 2 ? [] : ['ears[2]']),
    ...(r.legs && r.legs.length === 4 ? [] : ['legs[4]']),
    ...(typeof r.sole === 'function' ? [] : ['sole()']),
    ...(typeof r.poseLeg === 'function' ? [] : ['poseLeg()']),
    ...(typeof r.poseBody === 'function' ? [] : ['poseBody()']),
    ...(r.parts && typeof r.parts[Symbol.iterator] === 'function' ? [] : ['parts itérable']),
  ];
  // L'ORDRE des pattes porte du sens : GAITS.trot.ph = [0, π, π, 0] apparie
  // legs[0] avec legs[3] et legs[1] avec legs[2] — ce sont les DIAGONALES. Un
  // ordre FL, BL, FR, BR ferait trotter le chien à l'amble, sans une erreur.
  const ordreOk = !!r && r.legs && r.legs.length === 4
    && r.legs[0].front && r.legs[1].front && !r.legs[2].front && !r.legs[3].front
    && Math.sign(r.legs[0].hip.position.x) === -Math.sign(r.legs[1].hip.position.x)
    && Math.sign(r.legs[2].hip.position.x) === -Math.sign(r.legs[3].hip.position.x);
  check('rig glTF : contrat complet, pattes FL FR BL BR',
    manque.length === 0 && ordreOk,
    r ? `${r.skeleton.bones.length} os, pattes ${r.legs.map((l) => l.key).join(' ')}`
        + (manque.length ? ` — manque : ${manque.join(', ')}` : '')
        + (ordreOk ? '' : ' — ORDRE DES PATTES FAUX')
      : gltfCause);
}

/* ── 23. échelle, orientation, et le dos hors de l'eau ── */
{
  const r = gltfRig;
  let ok = false, detail = gltfCause;
  if (r) {
    r.root.updateMatrixWorld(true);
    const { milieu, semelle } = milieuAppuisGltf(r);
    const zTete = r.head.getWorldPosition(new THREE.Vector3()).z;
    const zQueue = r.tailBase.getWorldPosition(new THREE.Vector3()).z;
    // Version *rig* de l'invariant 11 : lui ne teste que des constantes et
    // laisserait passer un chibi submergé.
    const dos = hauteurDosGltf(r) * SHIBA_BUILD.scale;
    const flot = r.swimFloat ?? SHIBA.swimFloat;
    ok = Math.abs(milieu) <= 0.02 && Math.abs(semelle) <= 0.02
      && zTete > zQueue && dos > flot + 0.03;
    detail = `milieu des appuis ${milieu.toFixed(4)}, semelle ${semelle.toFixed(4)} `
      + `(plafonds 0.020), dos ${dos.toFixed(3)} > flottaison ${flot} `
      + `(émergé ${(dos - flot).toFixed(3)})`;
  }
  check('rig glTF : appuis centrés, +Z, dos hors de l’eau', ok, detail);
}

/* ── 24. poids bien formés ── */
{
  const r = gltfRig;
  let ok = false, detail = gltfCause;
  if (r) {
    const si = r.mesh.geometry.attributes.skinIndex;
    const sw = r.mesh.geometry.attributes.skinWeight;
    const n = r.skeleton.bones.length;
    let pire = 0, horsBornes = 0, negatifs = 0, parasites = 0;
    for (let v = 0; v < si.count; v++) {
      let s = 0;
      for (const c of ['X', 'Y', 'Z', 'W']) {
        const w = sw['get' + c](v), i = si['get' + c](v);
        s += w;
        if (w < 0) negatifs++;
        if (i < 0 || i >= n) horsBornes++;
        // Une influence de poids nul DOIT porter l'indice 0 : les 4 termes sont
        // toujours évalués par le shader, et 0.0 * NaN = NaN détruit le vertex.
        if (w === 0 && i !== 0) parasites++;
      }
      pire = Math.max(pire, Math.abs(s - 1));
    }
    ok = pire < 1e-4 && !horsBornes && !negatifs && !parasites;
    detail = `écart max à 1 : ${pire.toExponential(2)}, hors bornes ${horsBornes}, `
      + `négatifs ${negatifs}, indices parasites ${parasites}`;
  }
  check('rig glTF : poids bien formés', ok, detail);
}

/* ── 25. rig non dégénéré ── */
{
  const r = gltfRig;
  let ok = false, detail = gltfCause;
  if (r) {
    const dom = compterDominance(r);
    const pattes = r.skeleton.bones.filter((b) => /^(hip|knee|paw)/.test(b.name));
    const minPatte = Math.min(...pattes.map((b) => dom.get(b.name) || 0));
    const tronc = ['head', 'neck', 'tailBase', 'lidL', 'lidR'];
    const minTronc = Math.min(...tronc.map((k) => dom.get(k) || 0));
    // `jaw` à EXACTEMENT 0 est la version testable de « aucun vertex sous son
    // influence » : la gueule est peinte dans la texture. `tilt` est exclu, il
    // est structurel.
    ok = minPatte >= 20 && minTronc >= 10 && (dom.get('jaw') || 0) === 0;
    detail = `os de patte le plus pauvre ${minPatte} (plancher 20), `
      + `tronc/tête ${minTronc} (plancher 10), jaw ${dom.get('jaw')} (doit être 0)`;
  }
  check('rig glTF : chaque os porte de la matière, jaw aucune', ok, detail);
}

/* ── 26. non-explosion sur 12 poses, et latéralité ────────────────────────
 * Les poses sont posées DIRECTEMENT sur les os, via poseLeg/poseBody :
 * animate() est privée du closure de createShiba, ce n'est pas une API de
 * test, et on ne duplique pas sa formule non plus.
 *
 * RÉSERVE, à lire avant de toucher aux seuils : cet invariant attrape les
 * EXPLOSIONS, pas les défauts de peau. Pendant le chantier G, une déchirure du
 * ventre bien visible en gros plan donnait une dérive de 0.290 pour un plafond
 * de 0.35 — il aurait déclaré la chose saine. Le gros plan reste obligatoire.
 * Et la marge est mince : le pire cas mesuré (0.335) est le SECOUAGE, dont
 * l'essentiel est une rotation RIGIDE de tout le corps, pas une déformation.
 */
{
  const r = gltfRig;
  let ok = false, detail = gltfCause;
  if (r) {
    const POSES = [
      ['repos', { hip: 0, knee: 0, sit: 0 }],
      ['marche φ0', { hip: 0.30, knee: -0.36, sit: 0 }],
      ['trot φ0', { hip: 0.62, knee: -0.84, sit: 0 }],
      ['galop φ0', { hip: 0.95, knee: -1.47, sit: 0 }],
      ['marche φπ', { hip: -0.30, knee: -0.36, sit: 0 }],
      ['trot φπ', { hip: -0.62, knee: -0.84, sit: 0 }],
      ['galop φπ', { hip: -0.95, knee: -1.47, sit: 0 }],
      ['nage', { hip: 1.34, knee: -1.20, sit: 0 }],
      ['assise', { hip: -0.85, knee: 1.95, sit: 1 }],
      ['secouage', { hip: 0, knee: 0, sit: 0, roll: 0.42 }],
      ['galop + tête', { hip: -0.95, knee: -1.47, sit: 0, head: 0.7, tail: 0.9 }],
      ['assise + clin', { hip: -0.85, knee: 1.95, sit: 1, blink: 1, ear: 0.46 }],
    ];
    const poser = (p) => {
      for (const leg of r.legs) r.poseLeg(leg, p.hip, p.knee, { swim: 0, sit: p.sit, shake: 0, speedN: 0 });
      r.poseBody(0, 0, p.roll || 0, { swim: 0, sit: p.sit, shake: 0, speedN: 0 });
      // Par les HOOKS, pas par des écritures directes : c'est le chemin que
      // animate() emprunte, saturations comprises. Écrire les rotations à la
      // main testerait un rig que personne ne pilote.
      r.poseHead({ headYaw: p.head || 0, headPitch: p.headPitch || 0, headRoll: 0,
        neckPitch: 0, neckRoll: 0 });
      r.poseTail(0, p.tail || 0, 0);
      for (const l of r.lids) l.rotation.x = p.blink ? 0.58 : -0.32;
      for (const e of r.ears) e.rotation.x = p.ear ?? -0.30;
      r.root.updateMatrixWorld(true);
    };
    const pos = r.mesh.geometry.attributes.position;
    const tmp = new THREE.Vector3();
    poser(POSES[0][1]);
    const repos = [];
    for (let v = 0; v < pos.count; v++) repos.push(r.mesh.getVertexPosition(v, tmp).clone());
    const diagRepos = new THREE.Box3().setFromPoints(repos).getSize(new THREE.Vector3()).length();

    let pireD = 0, pirePose = '', pireVol = 0;
    for (const [nom, p] of POSES) {
      poser(p);
      const pts = [];
      for (let v = 0; v < pos.count; v++) {
        r.mesh.getVertexPosition(v, tmp);
        pts.push(tmp.clone());
        const d = tmp.distanceTo(repos[v]);
        if (d > pireD) { pireD = d; pirePose = nom; }
      }
      const diag = new THREE.Box3().setFromPoints(pts).getSize(new THREE.Vector3()).length();
      pireVol = Math.max(pireVol, diag / diagRepos);
    }
    poser(POSES[0][1]);

    // Latéralité : aucun vertex d'un côté ne reçoit de poids d'une patte de
    // l'autre. C'est ce qui garantit que les pattes ne se collent pas.
    const si = r.mesh.geometry.attributes.skinIndex;
    const sw = r.mesh.geometry.attributes.skinWeight;
    let fuites = 0;
    for (let v = 0; v < pos.count; v++) {
      const x = pos.getX(v);
      if (Math.abs(x) <= 0.02) continue;
      for (const c of ['X', 'Y', 'Z', 'W']) {
        if (sw['get' + c](v) <= 0) continue;
        const m = /^(hip|knee|paw)[FB]([LR])$/.exec(r.skeleton.bones[si['get' + c](v)].name);
        if (m && ((m[2] === 'L' && x > 0.02) || (m[2] === 'R' && x < -0.02))) fuites++;
      }
    }
    ok = pireD <= 0.35 && pireVol <= 2 && fuites === 0;
    detail = `dérive max ${pireD.toFixed(3)} sur « ${pirePose} » (plafond 0.350), `
      + `bbox ×${pireVol.toFixed(2)} (plafond 2.00), fuites latérales ${fuites}`;
  }
  check('rig glTF : aucune explosion sur 12 poses, pattes non collées', ok, detail);
}

/* ── lot 6. shiba : aboie, se secoue, regarde ─────────────────────────────
 * Purs : createShiba + update, pas de renderer. Le secouage n'existe que
 * après une immersion ≥ wetBeforeShake ; le regard n'écrit jamais heading.
 */
{
  const wrap = (a) => {
    let d = a;
    while (d > Math.PI) d -= Math.PI * 2;
    while (d < -Math.PI) d += Math.PI * 2;
    return d;
  };
  const dryWater = {
    surfaceAt: () => null,
    isPond: () => false,
    impact() {}, setSwimmer() {},
  };
  const never = createShiba({ seed: SEED, heightAt: island.heightAt, water: dryWater });
  let maxShake = 0;
  for (let i = 0; i < 80; i++) {
    never.update(i * 0.05, 0.05, null);
    maxShake = Math.max(maxShake, never.state.shake);
  }
  check('un shiba qui n’a jamais nagé ne se secoue pas',
    maxShake === 0 && never.state.wetTime === 0,
    `shake max ${maxShake.toFixed(3)}, wetTime ${never.state.wetTime.toFixed(3)}`);

  const h0 = never.state.heading;
  const px = never.position.x, pz = never.position.z, py = never.position.y;
  never.setLookTargets([{ x: px - 8, y: py + 1, z: pz, kind: 'pine' }]);
  for (let i = 0; i < 16; i++) never.update(4 + i * 0.05, 0.05, null);
  const hIdle = never.state.heading;
  const lookIdle = never.state.look;
  never.setStick(1, 0, true);
  for (let i = 0; i < 25; i++) never.update(6 + i * 0.016, 0.016, null);
  const hRun = never.state.heading;
  never.setStick(0, 0, false);
  check('le regard ne détourne pas le corps en course',
    Math.abs(wrap(hIdle - h0)) < 0.08 && Math.abs(hRun) < 0.85 && lookIdle > 0.4,
    `idle Δheading ${wrap(hIdle - h0).toFixed(3)}, run heading ${hRun.toFixed(3)}, lookIdle ${lookIdle.toFixed(2)}`);
  never.dispose();
}

{
