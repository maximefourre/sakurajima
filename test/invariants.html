/* ── lot 8. sentier est + bosquet de bambous ───────────────────────────────
 * Purs : PATHS + computeBambooSpawns. Les rubans 8–10 ci-dessus jugent déjà
 * les quatre routes (dont `bambous`) au même plafond 0.55. */
{
  const route = PATHS.routes.find((r) => r.name === 'bambous');
  const [jx, jz] = PATHS.routes[0].points[0];
  const start = route ? route.points[0] : [NaN, NaN];
  const end = route ? route.points[route.points.length - 1] : [NaN, NaN];
  const bump = [56 * LAND_SCALE, -10 * LAND_SCALE];
  const startOk = route && Math.hypot(start[0] - jx, start[1] - jz) < 1e-6;
  const visitsBump = route && route.points.some(([x, z]) => Math.hypot(x - bump[0], z - bump[1]) < 8);
  const throughGrove = route && (end[0] - bump[0]) > 10 * LAND_SCALE;
  check('route bambous : du carrefour à travers la bosse est',
    !!route && startOk && visitsBump && throughGrove && route.points.length >= 8,
    route
      ? `${route.points.length} pts, fin→bosse ${Math.hypot(end[0] - bump[0], end[1] - bump[1]).toFixed(2)}, Δx=${((end[0] - bump[0]) / LAND_SCALE).toFixed(1)}·L`
      : 'route absente');

  const want = QUALITY[TIER].bamboo;
  const spots = computeBambooSpawns({
    heightAt: island.heightAt,
    isOnPath,
    isInPond: ponds.isInPond,
    slopeAt: island.slopeAt,
    count: want,
    seed: SEED,
  });
  let onPath = 0, west = 0, offGrove = 0;
  for (const s of spots) {
    if (isOnPath(s.x, s.z, BAMBOO.pathClear)) onPath++;
    if (s.x <= jx) west++;
    if (!inBambooGrove(s.x, s.z, 0.05)) offGrove++;
  }
  check('bosquet de bambous à l’est du carrefour, hors ruban',
    spots.length >= Math.floor(want * 0.6) && onPath === 0 && west === 0 && offGrove === 0,
    `${spots.length}/${want}, ${onPath} sur ruban, ${west} à l’ouest, ${offGrove} hors bosquet`);
}

/* ── mousse des rochers, biais nord (−Z, même convention que sky.js) ─ */
{
  const northFace = rockMossAmount(0.9, 0, 0.4, -0.9, 0.5);
  const southFace = rockMossAmount(0.9, 0, 0.4, 0.9, 0.5);
  check('mousse rocher : face nord plus chargée que face sud',
    northFace > southFace * 1.05,
    `N=${northFace.toFixed(3)} S=${southFace.toFixed(3)}`);
}

/* ── épaules de sentier ─────────────────────────────────────────── */
{
  const [jx, jz] = PATHS.routes[0].points[0];
  check('épaule : le ruban refuse toute litière',
    pathLitterOk(jx, jz, 0) === false && pathLitterOk(jx, jz, 0.99) === false,
    `carrefour (${jx.toFixed(1)},${jz.toFixed(1)})`);
  check('épaule : hors chemin toujours accepté',
    pathLitterOk(0, 400, 0.99) === true);

  let shoulder = null;
  const route = PATHS.routes.find((r) => r.name === 'plage') || PATHS.routes[2];
  const a = route.points[3], b = route.points[4];
  const mx = (a[0] + b[0]) * 0.5, mz = (a[1] + b[1]) * 0.5;
  for (let ang = 0; ang < Math.PI * 2 && !shoulder; ang += Math.PI / 8) {
    const cx = Math.cos(ang), cz = Math.sin(ang);
    for (let t = 0.05; t < 8; t += 0.08) {
      const x = mx + cx * t, z = mz + cz * t;
      if (!isOnPath(x, z, 0) && isOnPath(x, z, PATHS.shoulder ?? 0.8)) {
        shoulder = [x, z];
        break;
      }
    }
  }
  check('épaule : bande parfois acceptée, souvent refusée',
    !!shoulder
      && pathLitterOk(shoulder[0], shoulder[1], 0) === true
      && pathLitterOk(shoulder[0], shoulder[1], 0.99) === false,
    shoulder ? `${shoulder[0].toFixed(2)},${shoulder[1].toFixed(2)}` : 'pas de bande');

  let onRibbon = 0;
  const nf = flowerSpots.length / 3;
  for (let i = 0; i < nf; i++) {
    if (isOnPath(flowerSpots[i * 3], flowerSpots[i * 3 + 2], 0)) onRibbon++;
  }
  check('fleurs : zéro sur le ruban',
    onRibbon === 0,
    `${onRibbon}/${nf}`);
}

/* ── lit sonore (poids purs, pas d’AudioContext) ─────────────────── */
{
  const sea = ambientWeights({
    height: 0.3, seaLevel: 0, inGrove: false, pondDist: 80,
    night: 0, twilight: 0, windStrength: 0.4,
  });
  check('ambiance : surf dominant sur la laisse',
    sea.surf > 0.7 && sea.cicada < 0.25 && sea.frogs < 0.05 && sea.bamboo === 0,
    `surf=${sea.surf.toFixed(2)} cicada=${sea.cicada.toFixed(2)}`);

  const grove = ambientWeights({
    height: 8, seaLevel: 0, inGrove: true, pondDist: 80,
    night: 0, twilight: 0, windStrength: 1.1,
  });
  check('ambiance : bambou seulement dans le bosquet, poussé par le vent',
    grove.bamboo > 0.6 && grove.surf < 0.25,
    `bamboo=${grove.bamboo.toFixed(2)}`);

  const inlandDay = ambientWeights({
    height: 8, seaLevel: 0, inGrove: false, pondDist: 80,
    night: 0, twilight: 0, windStrength: 0.4,
  });
  const inlandNight = ambientWeights({
    height: 8, seaLevel: 0, inGrove: false, pondDist: 80,
    night: 1, twilight: 0, windStrength: 0.4,
  });
  check('ambiance : cigales le jour à l’intérieur, muettes la nuit',
    inlandDay.cicada > 0.35 && inlandNight.cicada < 0.05,
    `day=${inlandDay.cicada.toFixed(2)} night=${inlandNight.cicada.toFixed(2)}`);

  const pondDusk = ambientWeights({
    height: 7, seaLevel: 0, inGrove: false, pondDist: 1.5,
    night: 0.2, twilight: 0.8, windStrength: 0.2,
  });
  const pondFar = ambientWeights({
    height: 7, seaLevel: 0, inGrove: false, pondDist: 40,
    night: 0.2, twilight: 0.8, windStrength: 0.2,
  });
  check('ambiance : grenouilles au crépuscule près d’un étang, pas au large',
    pondDusk.frogs > 0.45 && pondFar.frogs < 0.08,
    `near=${pondDusk.frogs.toFixed(2)} far=${pondFar.frogs.toFixed(2)}`);
}

finish();
</script>
